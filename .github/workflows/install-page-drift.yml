# Read the current structured release and supervised-install contracts.
# An intentional hold is healthy monitoring state, never promotion permission.
name: install-page-drift

on:
  schedule:
    - cron: "17 14 * * *"   # 07:17 Phoenix, daily
  workflow_dispatch:
  release:
    types: [published]

jobs:
  check:
    name: verify held or stable public release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify live manifest, agent guides, and any stable package bytes
        run: node scripts/check-install-page-version.mjs
