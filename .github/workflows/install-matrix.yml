# Package-only portion of Tier 1 in docs/INSTALL-TEST-SOP.md. This workflow reads
# the PUBLISHED supervised-install contract and its sealed field kit, rejects a
# malformed or mutable outer receipt, validates the platform guide's actual npm
# command, installs into a throwaway prefix (including real PowerShell/npm.cmd on
# Windows), and runs package-local version and doctor checks. It does not
# provision Cloudflare, exercise the deployed browser, or complete a physical
# owner ceremony.
name: install-matrix

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "41 14 * * *"   # 07:41 Phoenix, after install-page-drift

permissions:
  contents: read

jobs:
  public-contract-install:
    name: ${{ matrix.os }} follows the published install contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # Apple silicon, the path most clients are on
            guide: macos
          - os: macos-13        # Intel, older Macs
            guide: macos
          - os: ubuntu-latest   # the cheapest canary
            guide: macos
          - os: windows-latest  # the PowerShell and npm.cmd path
            guide: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # A fresh runner is the point. If a brain or a prior install were present
      # the run would prove nothing about a client's first install.
      - name: prove this machine has no brain
        shell: bash
        run: |
          if [ -e "$HOME/.brain" ]; then echo "::error::runner is not fresh"; exit 1; fi
          command -v brain >/dev/null && { echo "::error::a brain CLI is already on PATH"; exit 1; }
          echo "no brain, no CLI: this is a first install"

      - name: verify and install from the published package contract
        shell: bash
        run: node scripts/install-from-public-contract.mjs "${RUNNER_TEMP}/install-run" --guide ${{ matrix.guide }}

      # The Actions log is the command transcript. Keep the downloaded public
      # guides and receipts beside it so a later review can identify the exact
      # contract the job followed.
      - name: keep the downloaded public contract documents
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-contract-${{ matrix.os }}
          path: ${{ runner.temp }}/install-run/**/*.md
          if-no-files-found: ignore
          retention-days: 14

# OPEN GATE: the provisioning half.
#
# The valuable second job creates one Worker, one D1 database and one Vectorize
# index on the disposable test account, ingests the package's own public
# CHANGELOG.md, asks one answerable and one unanswerable question to exercise
# the refusal contract, and tears everything down. It is deliberately absent
# rather than present-and-skipped, because a job that green-ticks without
# provisioning anything is precisely the failure this file exists to end: the
# SOP must keep this boundary visible.
#
# It needs three repository secrets that do not exist yet:
#   BRAIN_TEST_CF_TOKEN        the scoped test-account token (4 install permissions)
#   BRAIN_TEST_CF_ACCOUNT      the disposable test account id
#   BRAIN_TEARDOWN_PROTECTED   the live-resource lock; teardown REFUSES when unset,
#                              and the test account hosts a live preview brain
#
# Add those, then the job lands with them, tested, in one change.
# The deployed-browser matrix and physical passkey ceremony remain separate
# open gates as documented in the SOP; this package job cannot prove either.
