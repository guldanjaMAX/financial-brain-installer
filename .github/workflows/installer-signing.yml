name: installer-signing

on:
  workflow_dispatch:
    inputs:
      wix_osmf_confirmed:
        description: Confirm the WiX v7 Open Source Maintenance Fee decision before downloading its binary SDK
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: installer-signing
  cancel-in-progress: false

jobs:
  authorization:
    name: authorize default-branch signing dispatch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.SIGNING_REPOSITORY != '' &&
      github.repository == vars.SIGNING_REPOSITORY
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - id: authorization
        run: echo "authorized=true" >> "$GITHUB_OUTPUT"

  configuration:
    name: inspect protected signing configuration
    needs: authorization
    if: needs.authorization.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    environment: artifact-signing
    permissions:
      contents: read
    outputs:
      macos_configured: ${{ steps.gate.outputs.macos_configured }}
      windows_configured: ${{ steps.gate.outputs.windows_configured }}
    steps:
      - name: decide which signing jobs are configured
        id: gate
        shell: bash
        env:
          APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          WIX_OSMF_CONFIRMED: ${{ inputs.wix_osmf_confirmed }}
        run: |
          set -euo pipefail
          echo "macos_configured=false" >> "$GITHUB_OUTPUT"
          echo "windows_configured=false" >> "$GITHUB_OUTPUT"

          mac_missing=0
          for value in "$APP_P12" "$APP_PASSWORD" "$INSTALLER_P12" "$INSTALLER_PASSWORD" \
            "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID" "$NOTARY_P8" "$APPLE_TEAM_ID"; do
            [ -n "$value" ] || mac_missing=1
          done
          if [ "$mac_missing" -eq 0 ]; then
            echo "macos_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing skipped cleanly for macOS because one or more protected settings are absent." >> "$GITHUB_STEP_SUMMARY"
          fi

          windows_missing=0
          for value in "$AZURE_TENANT_ID" "$AZURE_CLIENT_ID" "$AZURE_SUBSCRIPTION_ID" \
            "$ARTIFACT_SIGNING_ENDPOINT" "$ARTIFACT_SIGNING_ACCOUNT" "$ARTIFACT_SIGNING_PROFILE"; do
            [ -n "$value" ] || windows_missing=1
          done
          if [ "$windows_missing" -eq 0 ] && [ "$WIX_OSMF_CONFIRMED" = "true" ]; then
            echo "windows_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing skipped cleanly for Windows because a protected setting or wix_osmf_confirmed is absent." >> "$GITHUB_STEP_SUMMARY"
          fi

  macos-sign:
    name: build, sign, notarize, and staple the macOS package
    needs: configuration
    if: needs.configuration.outputs.macos_configured == 'true'
    runs-on: macos-latest
    environment: artifact-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          package-manager-cache: false
      - name: test installer source before signing
        run: node --test test/machine-prep-installers.test.mjs test/machine-prep.test.mjs
      - name: import both Developer ID identities into a temporary keychain
        shell: bash
        env:
          APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/installer-signing.keychain-db"
          marker="$RUNNER_TEMP/installer-signing.keychain-owner"
          attempt_id="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_MARKER=$marker" >> "$GITHUB_ENV"
          echo "SIGNING_ATTEMPT_ID=$attempt_id" >> "$GITHUB_ENV"
          import_complete=0
          cleanup_signing_material() {
            if [ "$import_complete" -eq 0 ]; then
              SIGNING_KEYCHAIN="$keychain" SIGNING_KEYCHAIN_MARKER="$marker" SIGNING_ATTEMPT_ID="$attempt_id" \
                bash machine-prep/installers/macos/cleanup-signing-material.sh
            fi
          }
          trap cleanup_signing_material EXIT
          # The keychain exists only on the ephemeral runner. An empty temporary
          # password avoids placing a credential in a process argument.
          if [ -e "$keychain" ] || [ -L "$keychain" ] || [ -e "$marker" ] || [ -L "$marker" ]; then
            echo "::error::Signing keychain path is already occupied"
            exit 1
          fi
          security create-keychain -p "" "$keychain"
          printf '%s\n' "$attempt_id" > "$marker"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          printf '%s' "$APP_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/application.p12" -nodes -passin env:APP_PASSWORD -out "$RUNNER_TEMP/application.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/installer.p12" -nodes -passin env:INSTALLER_PASSWORD -out "$RUNNER_TEMP/installer.pem"
          security import "$RUNNER_TEMP/application.pem" -k "$keychain" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.pem" -k "$keychain" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          application_line="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print; exit }')"
          installer_line="$(security find-identity -v -p basic "$keychain" | awk '/Developer ID Installer/ { print; exit }')"
          application_identity="$(printf '%s\n' "$application_line" | awk '{ print $2 }')"
          installer_identity="$(printf '%s\n' "$installer_line" | awk '{ print $2 }')"
          [ -n "$application_identity" ] || { echo "::error::Developer ID Application identity missing"; exit 1; }
          [ -n "$installer_identity" ] || { echo "::error::Developer ID Installer identity missing"; exit 1; }
          case "$application_line" in *"($APPLE_TEAM_ID)"*) : ;; *) echo "::error::Developer ID Application Team ID mismatch"; exit 1 ;; esac
          case "$installer_line" in *"($APPLE_TEAM_ID)"*) : ;; *) echo "::error::Developer ID Installer Team ID mismatch"; exit 1 ;; esac
          echo "APPLICATION_IDENTITY=$application_identity" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
          import_complete=1
      - name: build the package and codesign every embedded Mach-O executable
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/macos-stage"
          bash machine-prep/installers/macos/build-pkg.sh --staging-only "$stage"
          signed=0
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$APPLICATION_IDENTITY" --keychain "$SIGNING_KEYCHAIN" "$candidate"
              codesign --verify --deep --strict --verbose=2 "$candidate"
              signed=$((signed + 1))
            fi
          done < <(find "$stage/payload" -type f -perm -111 -print0)
          echo "EMBEDDED_EXECUTABLES_SIGNED=$signed"
          pkgbuild --root "$stage/payload" \
            --identifier com.financialbrain.machineprep --version 0.2.0 --install-location / \
            "$stage/FinancialBrainMachinePrep-component.pkg"
          productbuild --distribution "$stage/Distribution.xml" --resources "$stage/resources" \
            --package-path "$stage" "$RUNNER_TEMP/FinancialBrainInstaller-unsigned.pkg"
          mkdir -p dist
          productsign --timestamp --sign "$INSTALLER_IDENTITY" --keychain "$SIGNING_KEYCHAIN" \
            "$RUNNER_TEMP/FinancialBrainInstaller-unsigned.pkg" dist/FinancialBrainInstaller.pkg
          pkgutil --check-signature dist/FinancialBrainInstaller.pkg
      - name: notarize, staple, and verify the exact package
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_P8" | base64 --decode > "$key"
          xcrun notarytool submit dist/FinancialBrainInstaller.pkg --key "$key" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/FinancialBrainInstaller.pkg
          xcrun stapler validate dist/FinancialBrainInstaller.pkg
          spctl --assess --type install --verbose=2 dist/FinancialBrainInstaller.pkg
          pkgutil --check-signature dist/FinancialBrainInstaller.pkg
          shasum -a 256 dist/FinancialBrainInstaller.pkg > dist/FinancialBrainInstaller.pkg.sha256
      - name: upload the signed and notarized package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FinancialBrainInstaller-macOS-signed
          path: |
            dist/FinancialBrainInstaller.pkg
            dist/FinancialBrainInstaller.pkg.sha256
          retention-days: 14
      - name: remove temporary signing material
        if: always()
        shell: bash
        run: |
          bash machine-prep/installers/macos/cleanup-signing-material.sh

  windows-sign:
    name: build and sign the Windows MSI
    needs: configuration
    if: needs.configuration.outputs.windows_configured == 'true'
    runs-on: windows-latest
    environment: artifact-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: test and build only after the WiX OSMF confirmation
        shell: pwsh
        env:
          WIX_OSMF_CONFIRMED: ${{ inputs.wix_osmf_confirmed }}
        run: |
          if ($env:WIX_OSMF_CONFIRMED -ne 'true') { throw 'WiX OSMF decision is not confirmed; nothing was built' }
          node --test test/machine-prep-installers.test.mjs test/machine-prep.test.mjs
          dotnet build machine-prep/installers/windows/FinancialBrainMachinePrep.wixproj --configuration Release -p:WixOsmfConfirmed=true
          $msi = Get-ChildItem machine-prep/installers/windows/bin -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'WiX build did not produce an MSI' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $msi.FullName -Destination dist/FinancialBrainInstaller.msi
          & machine-prep/installers/windows/verify-msi.ps1 dist/FinancialBrainInstaller.msi
      - name: sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: sign with Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\FinancialBrainInstaller.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: verify the signed MSI
        shell: pwsh
        run: |
          $msi = Resolve-Path dist/FinancialBrainInstaller.msi
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          if ($signature.Status -ne 'Valid') { throw "the MSI signature is $($signature.Status), not Valid" }
          if (-not $signature.TimeStamperCertificate) { throw 'the MSI signature carries no RFC 3161 timestamp' }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe was not found' }
          & $signtool.FullName verify /pa /v $msi
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi).Hash.ToLowerInvariant()
          "$hash  FinancialBrainInstaller.msi" | Set-Content -Encoding ascii dist/FinancialBrainInstaller.msi.sha256
      - name: upload the signed MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FinancialBrainInstaller-Windows-signed
          path: |
            dist/FinancialBrainInstaller.msi
            dist/FinancialBrainInstaller.msi.sha256
          retention-days: 14
