name: machine-prep-installers

on:
  workflow_dispatch:
    inputs:
      wix_osmf_confirmed:
        description: Confirm the WiX v7 Open Source Maintenance Fee decision before downloading its binary SDK
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-unsigned:
    name: build unsigned macOS package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          package-manager-cache: false
      - name: test macOS installer source and package contents
        run: node --test test/machine-prep-installers.test.mjs
      - name: build unsigned macOS package
        run: |
          mkdir -p dist
          bash machine-prep/installers/macos/build-pkg.sh dist/FinancialBrainMachinePrep-unsigned.pkg
          pkgutil --payload-files dist/FinancialBrainMachinePrep-unsigned.pkg
          shasum -a 256 dist/FinancialBrainMachinePrep-unsigned.pkg
      - name: upload unsigned macOS package only
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # With archive: false the artifact is named after the file
          # (FinancialBrainMachinePrep-unsigned.pkg); upload-artifact ignores this name.
          name: FinancialBrainMachinePrep-macOS-unsigned
          path: dist/FinancialBrainMachinePrep-unsigned.pkg
          archive: false
          retention-days: 14
      # installer-signing.yml signs only an artifact whose ID and digest the
      # dispatcher copies from here, and re-proves both through the API.
      - name: record the artifact ID and digest to sign
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "### FinancialBrainMachinePrep-unsigned.pkg"
            echo ""
            echo "- unsigned_run_id: $GITHUB_RUN_ID"
            echo "- unsigned_artifact_id: $ARTIFACT_ID"
            echo "- unsigned_sha256: ${ARTIFACT_DIGEST#sha256:}"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-unsigned:
    name: build unsigned Windows MSI
    runs-on: windows-latest
    steps:
      # WiX v7 requires its Open Source Maintenance Fee EULA to be accepted by
      # name. The acceptance below is passed only after the dispatcher confirms
      # the fee decision; without it the job stops before downloading WiX.
      - name: stop unless the WiX OSMF decision is confirmed
        if: ${{ !inputs.wix_osmf_confirmed }}
        shell: powershell
        run: |
          Write-Output "::error::The Windows MSI was not built. WiX v7 requires its Open Source Maintenance Fee EULA. Re-run this workflow with wix_osmf_confirmed=true once the fee decision is confirmed."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: test Windows installer source and refusal gates
        shell: powershell
        run: node --test test/machine-prep-installers.test.mjs test/machine-prep.test.mjs
      - name: build and inspect unsigned Windows MSI
        if: inputs.wix_osmf_confirmed
        shell: powershell
        env:
          WIX_OSMF_CONFIRMED: ${{ inputs.wix_osmf_confirmed }}
        run: |
          if ($env:WIX_OSMF_CONFIRMED -ne 'true') { throw "WiX OSMF decision is not confirmed; nothing was built" }
          dotnet build machine-prep/installers/windows/FinancialBrainMachinePrep.wixproj --configuration Release -p:WixOsmfConfirmed=true
          $msi = Get-ChildItem machine-prep/installers/windows/bin -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "WiX build did not produce an MSI" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $msi.FullName -Destination dist/FinancialBrainMachinePrep-unsigned.msi
          & machine-prep/installers/windows/verify-msi.ps1 dist/FinancialBrainMachinePrep-unsigned.msi
          Get-FileHash -Algorithm SHA256 dist/FinancialBrainMachinePrep-unsigned.msi
      - name: upload unsigned Windows MSI only
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # With archive: false the artifact is named after the file
          # (FinancialBrainMachinePrep-unsigned.msi); upload-artifact ignores this name.
          name: FinancialBrainMachinePrep-Windows-unsigned
          path: dist/FinancialBrainMachinePrep-unsigned.msi
          archive: false
          retention-days: 14
      # installer-signing.yml signs only an artifact whose ID and digest the
      # dispatcher copies from here, and re-proves both through the API.
      - name: record the artifact ID and digest to sign
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "### FinancialBrainMachinePrep-unsigned.msi"
            echo ""
            echo "- unsigned_run_id: $GITHUB_RUN_ID"
            echo "- unsigned_artifact_id: $ARTIFACT_ID"
            echo "- unsigned_sha256: ${ARTIFACT_DIGEST#sha256:}"
          } >> "$GITHUB_STEP_SUMMARY"
