name: Windows kit selftest

on:
  push:
    branches:
      - claude/windows-kit-rehearsal

permissions:
  contents: read

jobs:
  windows-powershell-5-1:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run selftest
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File kits/windows/brain-windows-update.ps1 selftest 2>&1 | Tee-Object -FilePath windows-powershell-5.1.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise synthetic SHA256SUMS gate
        shell: powershell
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'synthetic-four-file-kit-5.1'
          New-Item -ItemType Directory -Path $kit -Force | Out-Null
          Copy-Item kits/windows/brain-windows-update.ps1 (Join-Path $kit 'brain-windows-update.ps1')
          Copy-Item kits/windows/README-WINDOWS-KIT.md (Join-Path $kit 'README-WINDOWS-KIT.md')
          [System.IO.File]::WriteAllBytes((Join-Path $kit 'brain-installer-0.4.8.tgz'), [byte[]](0x1f,0x8b,0x08,0x00))
          [System.IO.File]::WriteAllText((Join-Path $kit 'field-prepare-receipt.json'), '{"synthetic":true}', (New-Object System.Text.UTF8Encoding($false)))
          $names = @('brain-installer-0.4.8.tgz','field-prepare-receipt.json','brain-windows-update.ps1','README-WINDOWS-KIT.md')
          $lines = @($names | ForEach-Object { ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $kit $_)).Hash.ToLowerInvariant() + '  ' + $_) })
          [System.IO.File]::WriteAllLines((Join-Path $kit 'SHA256SUMS'), $lines, (New-Object System.Text.ASCIIEncoding))
          powershell -NoProfile -ExecutionPolicy Bypass -File kits/windows/brain-windows-update.ps1 selftest -Kit $kit 2>&1 | Tee-Object -FilePath windows-powershell-5.1-sha-gate.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stream = [System.IO.File]::Open((Join-Path $kit 'brain-installer-0.4.8.tgz'), [System.IO.FileMode]::Append)
          try { $stream.WriteByte(0x21) } finally { $stream.Dispose() }
          $refusal = (& powershell -NoProfile -ExecutionPolicy Bypass -File kits/windows/brain-windows-update.ps1 __verify-checksums -Kit $kit 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $refusal | Tee-Object -FilePath windows-powershell-5.1-sha-refusal.txt
          if ($code -ne 65) { throw "tampered checksum gate exited $code, expected 65" }
          if ($refusal -notmatch 'brain-installer-0\.4\.8\.tgz: SHA-256 MISMATCH') { throw 'tampered checksum gate did not name the package mismatch' }
          if ($refusal -notmatch 'do not match SHA256SUMS') { throw 'tampered checksum gate did not print the refusal message' }
          exit 0
      - name: Upload selftest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-powershell-5.1-selftest
          path: windows-powershell-5.1*.txt

  windows-powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run selftest
        shell: pwsh
        run: |
          pwsh -NoProfile -File kits/windows/brain-windows-update.ps1 selftest 2>&1 | Tee-Object -FilePath windows-powershell-7.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise synthetic SHA256SUMS gate
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'synthetic-four-file-kit-7'
          New-Item -ItemType Directory -Path $kit -Force | Out-Null
          Copy-Item kits/windows/brain-windows-update.ps1 (Join-Path $kit 'brain-windows-update.ps1')
          Copy-Item kits/windows/README-WINDOWS-KIT.md (Join-Path $kit 'README-WINDOWS-KIT.md')
          [System.IO.File]::WriteAllBytes((Join-Path $kit 'brain-installer-0.4.8.tgz'), [byte[]](0x1f,0x8b,0x08,0x00))
          [System.IO.File]::WriteAllText((Join-Path $kit 'field-prepare-receipt.json'), '{"synthetic":true}', (New-Object System.Text.UTF8Encoding($false)))
          $names = @('brain-installer-0.4.8.tgz','field-prepare-receipt.json','brain-windows-update.ps1','README-WINDOWS-KIT.md')
          $lines = @($names | ForEach-Object { ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $kit $_)).Hash.ToLowerInvariant() + '  ' + $_) })
          [System.IO.File]::WriteAllLines((Join-Path $kit 'SHA256SUMS'), $lines, (New-Object System.Text.ASCIIEncoding))
          pwsh -NoProfile -File kits/windows/brain-windows-update.ps1 selftest -Kit $kit 2>&1 | Tee-Object -FilePath windows-powershell-7-sha-gate.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stream = [System.IO.File]::Open((Join-Path $kit 'brain-installer-0.4.8.tgz'), [System.IO.FileMode]::Append)
          try { $stream.WriteByte(0x21) } finally { $stream.Dispose() }
          $PSNativeCommandUseErrorActionPreference = $false
          $refusal = (& pwsh -NoProfile -File kits/windows/brain-windows-update.ps1 __verify-checksums -Kit $kit 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $refusal | Tee-Object -FilePath windows-powershell-7-sha-refusal.txt
          if ($code -ne 65) { throw "tampered checksum gate exited $code, expected 65" }
          if ($refusal -notmatch 'brain-installer-0\.4\.8\.tgz: SHA-256 MISMATCH') { throw 'tampered checksum gate did not name the package mismatch' }
          if ($refusal -notmatch 'do not match SHA256SUMS') { throw 'tampered checksum gate did not print the refusal message' }
          exit 0
      - name: Upload selftest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-powershell-7-selftest
          path: windows-powershell-7*.txt
