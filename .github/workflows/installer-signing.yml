name: installer-signing

# Signs artifacts that machine-prep-installers.yml already built and uploaded.
# The dispatcher copies unsigned_run_id, unsigned_artifact_id and unsigned_sha256
# from that run's summary. Each job's first step proves from GitHub's own run
# and artifact records that the artifact is the named file uploaded by the
# successful platform job of a workflow_dispatch run of that workflow that built
# the tip of the main branch or an ancestor of it in this repository, with that
# digest, before anything is downloaded; the download then selects it
# by immutable ID and the bytes are hashed again before signing. An upload with
# archive: false is named after its file, not its name: input, so the build's
# FinancialBrainMachinePrep-macOS-unsigned and FinancialBrainMachinePrep-Windows-unsigned
# labels never exist as artifact names.
# This workflow is separate so the unsigned build stays free of every signing
# tool, secret, and OIDC permission. Each job runs only inside the protected
# installer-signing environment, whose reviewers approve every run, and each
# job stops before touching an artifact when its configuration is missing.
on:
  workflow_dispatch:
    inputs:
      unsigned_run_id:
        description: Numeric run ID of the reviewed machine-prep-installers run on main
        required: true
        type: string
      target:
        description: Which unsigned artifact to sign; each has its own artifact ID and digest
        required: true
        type: choice
        options:
          - macos
          - windows
      unsigned_artifact_id:
        description: Numeric artifact ID that run's summary reported for the target installer
        required: true
        type: string
      unsigned_sha256:
        description: Lowercase SHA-256 that run's summary reported for the target installer
        required: true
        type: string

permissions: {}

concurrency:
  group: installer-signing
  cancel-in-progress: false

jobs:
  macos-sign:
    name: sign, notarize, and staple the macOS package
    if: inputs.target == 'macos'
    runs-on: macos-latest
    environment: installer-signing
    permissions:
      contents: read
      actions: read
    steps:
      - name: stop unless macOS signing is configured and the unsigned artifact is proven
        id: provenance
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVID_INSTALLER_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          UNSIGNED_RUN_ID: ${{ inputs.unsigned_run_id }}
          UNSIGNED_ARTIFACT_ID: ${{ inputs.unsigned_artifact_id }}
          UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
          EXPECTED_ARTIFACT_NAME: FinancialBrainMachinePrep-unsigned.pkg
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$P12_BASE64" ] || missing="$missing APPLE_DEVID_INSTALLER_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing APPLE_DEVID_INSTALLER_P12_PASSWORD"
          [ -n "$NOTARY_KEY_P8" ] || missing="$missing APPLE_NOTARY_KEY_P8"
          [ -n "$NOTARY_KEY_ID" ] || missing="$missing APPLE_NOTARY_KEY_ID"
          [ -n "$NOTARY_ISSUER_ID" ] || missing="$missing APPLE_NOTARY_ISSUER_ID"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(repository variable)"
          if [ -n "$missing" ]; then
            echo "::error::macOS installer signing is not configured yet. Add these installer-signing environment secrets:$missing. Nothing was downloaded or signed."
            exit 1
          fi
          if ! printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID must be the ten-character Apple Developer Team ID. Nothing was downloaded or signed."
            exit 1
          fi
          if ! printf '%s' "$UNSIGNED_RUN_ID" | grep -Eq '^[0-9]{1,20}$'; then
            echo "::error::unsigned_run_id must be the numeric run ID of a machine-prep-installers run. Nothing was downloaded or signed."
            exit 1
          fi
          node --input-type=module - <<'PROVENANCE'
          import { appendFileSync } from "node:fs";

          // Everything here reads the run and artifact records GitHub itself keeps.
          // A same-named artifact from any other run in this public repository,
          // including a fork's pull_request run, fails one of these comparisons.
          const env = process.env;
          const WORKFLOW_PATH = ".github/workflows/machine-prep-installers.yml";
          // The display name of the machine-prep-installers job that uploads each file.
          const PLATFORM_JOB = {
            "FinancialBrainMachinePrep-unsigned.pkg": "build unsigned macOS package",
            "FinancialBrainMachinePrep-unsigned.msi": "build unsigned Windows MSI",
          };
          class Refusal extends Error {}
          const refuse = (message) => { throw new Refusal(message); };

          async function prove() {
            const repository = env.GITHUB_REPOSITORY || "";
            const runId = env.UNSIGNED_RUN_ID || "";
            const artifactId = env.UNSIGNED_ARTIFACT_ID || "";
            const sha256 = env.UNSIGNED_SHA256 || "";
            const expectedName = env.EXPECTED_ARTIFACT_NAME || "";
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) refuse("GITHUB_REPOSITORY must be owner/name");
            if (!/^[1-9][0-9]{0,19}$/.test(runId)) refuse("unsigned_run_id must be the numeric run ID of a machine-prep-installers run");
            if (!/^[1-9][0-9]{0,19}$/.test(artifactId)) refuse("unsigned_artifact_id must be the numeric artifact ID that run reported");
            if (!/^[0-9a-f]{64}$/.test(sha256)) refuse("unsigned_sha256 must be the 64-character lowercase SHA-256 that run reported");
            if (!/^FinancialBrainMachinePrep-unsigned\.(?:pkg|msi)$/.test(expectedName)) refuse("EXPECTED_ARTIFACT_NAME must be an uploaded unsigned installer file name");
            const api = async (path) => {
              const response = await fetch(`${env.GITHUB_API_URL || "https://api.github.com"}${path}`, {
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: `Bearer ${env.GH_TOKEN || ""}`,
                  "x-github-api-version": "2022-11-28",
                },
              });
              if (!response.ok) refuse(`GitHub answered HTTP ${response.status} for ${path}`);
              return response.json();
            };
            // 404 is the one answer that proves absence; any other failure refuses.
            const apiUnlessMissing = async (path) => {
              const response = await fetch(`${env.GITHUB_API_URL || "https://api.github.com"}${path}`, {
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: `Bearer ${env.GH_TOKEN || ""}`,
                  "x-github-api-version": "2022-11-28",
                },
              });
              if (response.status === 404) return null;
              if (!response.ok) refuse(`GitHub answered HTTP ${response.status} for ${path}`);
              return response.json();
            };
            const jobName = PLATFORM_JOB[expectedName];
            const run = await api(`/repos/${repository}/actions/runs/${runId}`);
            if (String(run?.id) !== runId) refuse(`the API returned run ${run?.id}, not run ${runId}`);
            if (run.repository?.full_name !== repository) refuse(`run ${runId} belongs to another repository`);
            if (run.path !== WORKFLOW_PATH) refuse(`run ${runId} came from workflow ${run.path}, not ${WORKFLOW_PATH}`);
            if (run.event !== "workflow_dispatch") refuse(`run ${runId} was started by ${run.event}, not workflow_dispatch`);
            if (run.head_repository?.full_name !== repository) refuse(`run ${runId} built a head repository other than ${repository}`);
            if (run.head_branch !== "main") refuse(`run ${runId} built ${run.head_branch}, not main`);
            if (run.status !== "completed") {
              refuse(`run ${runId} is ${run.status}, not completed; the ${jobName} job must be completed with success`);
            }
            // head_branch is only a name: a dispatch on a tag called main also
            // reports "main". The run record carries no ref type, so the commit
            // it built must be the tip of the main branch or an ancestor of it,
            // and a main tag must not exist to make the name ambiguous.
            const headSha = String(run.head_sha || "");
            if (!/^[0-9a-f]{40}$/.test(headSha)) refuse(`run ${runId} has no 40-character head_sha`);
            const mainRef = await api(`/repos/${repository}/git/ref/heads/main`);
            const mainSha = String(mainRef?.object?.sha || "");
            if (mainRef?.ref !== "refs/heads/main" || mainRef?.object?.type !== "commit" || !/^[0-9a-f]{40}$/.test(mainSha)) {
              refuse("refs/heads/main did not resolve to a commit");
            }
            if (await apiUnlessMissing(`/repos/${repository}/git/ref/tags/main`) !== null) {
              refuse(`a tag named main exists in ${repository}, so run ${runId}'s head_branch "main" cannot be proven to be the main branch`);
            }
            // compare/{base}...{head} describes head relative to base: with main's
            // tip as base, an ancestor of main is "behind" and main itself is
            // "identical"; either way the merge base is the built commit.
            const comparison = await api(`/repos/${repository}/compare/${mainSha}...${headSha}`);
            if (!["behind", "identical"].includes(comparison?.status) || comparison.ahead_by !== 0 ||
                comparison.merge_base_commit?.sha !== headSha) {
              refuse(`run ${runId} built commit ${headSha}, which is not the tip of main or an ancestor of it (compare status ${comparison?.status})`);
            }
            // The default dispatch fails the Windows job on purpose (no WiX OSMF
            // confirmation), so the run's own conclusion cannot decide. The one
            // platform job that built this artifact must have succeeded.
            const jobList = await api(`/repos/${repository}/actions/runs/${runId}/jobs?per_page=100`);
            const jobs = Array.isArray(jobList?.jobs) ? jobList.jobs : [];
            if (jobList?.total_count !== jobs.length) {
              refuse(`run ${runId} lists ${jobList?.total_count} jobs but the API returned ${jobs.length}; an incomplete job list proves nothing`);
            }
            const platformJobs = jobs.filter((candidate) => candidate?.name === jobName);
            if (platformJobs.length !== 1) refuse(`run ${runId} has ${platformJobs.length} jobs named "${jobName}", not exactly one`);
            const [platformJob] = platformJobs;
            if (String(platformJob.run_id) !== runId) refuse(`the ${jobName} job belongs to run ${platformJob.run_id}, not run ${runId}`);
            if (platformJob.head_sha !== headSha) refuse(`the ${jobName} job built ${platformJob.head_sha}, not the run's head_sha ${headSha}`);
            if (platformJob.status !== "completed" || platformJob.conclusion !== "success") {
              refuse(`the ${jobName} job of run ${runId} is ${platformJob.status} with conclusion ${platformJob.conclusion}, not completed with success`);
            }
            const artifact = await api(`/repos/${repository}/actions/artifacts/${artifactId}`);
            if (String(artifact?.id) !== artifactId) refuse(`the API returned artifact ${artifact?.id}, not artifact ${artifactId}`);
            if (String(artifact.workflow_run?.id) !== runId) {
              refuse(`artifact ${artifactId} was uploaded by run ${artifact.workflow_run?.id}, not run ${runId}`);
            }
            if (artifact.name !== expectedName) refuse(`artifact ${artifactId} is named ${artifact.name}, not ${expectedName}`);
            if (artifact.expired !== false) refuse(`artifact ${artifactId} has expired`);
            if (artifact.digest !== `sha256:${sha256}`) {
              refuse(`artifact ${artifactId} digest ${artifact.digest} does not match the dispatched unsigned_sha256`);
            }
            appendFileSync(env.GITHUB_OUTPUT, `run_id=${runId}\nartifact_id=${artifactId}\n`);
            console.log(`artifact ${artifactId} (${expectedName}) is from the successful ${jobName} job of main workflow_dispatch run ${runId} at ${headSha}, SHA-256 ${sha256}`);
          }

          try {
            await prove();
          } catch (error) {
            const message = error instanceof Refusal ? error.message : `provenance could not be proven: ${error?.message || error}`;
            console.log(`::error::${message}. Nothing was downloaded or signed.`);
            process.exitCode = 1;
          }
          PROVENANCE
      - name: download the reviewed unsigned macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.provenance.outputs.artifact_id }}
          run-id: ${{ steps.provenance.outputs.run_id }}
          github-token: ${{ github.token }}
          path: unsigned
          skip-decompress: true
          digest-mismatch: error
      - name: verify the downloaded bytes against the dispatched SHA-256
        env:
          UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
        run: |
          set -euo pipefail
          actual="$(shasum -a 256 unsigned/FinancialBrainMachinePrep-unsigned.pkg | awk '{ print $1 }')"
          if [ "$actual" != "$UNSIGNED_SHA256" ]; then
            echo "::error::the downloaded package hashes to $actual, not the dispatched unsigned_sha256. Nothing was signed."
            exit 1
          fi
      - name: create a temporary signing keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVID_INSTALLER_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/installer-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid-installer.p12"
          security import "$RUNNER_TEMP/devid-installer.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/devid-installer.p12"
          # Lets productsign use the key without an interactive access prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Exactly one Developer ID Installer identity of the declared team, never
          # whichever identity happens to be listed first.
          identities="$(security find-identity -v -p basic "$keychain" |
            grep -F '"Developer ID Installer: ' | grep -F "($APPLE_TEAM_ID)\"" || true)"
          count="$(printf '%s' "$identities" | grep -c . || true)"
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one Developer ID Installer identity for team $APPLE_TEAM_ID in the imported certificate, found ${count:-0}. Nothing was signed."
            exit 1
          fi
          identity="$(printf '%s\n' "$identities" | awk '{ print $2 }')"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: sign the package with a secure timestamp
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          productsign --timestamp --sign "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN" \
            unsigned/FinancialBrainMachinePrep-unsigned.pkg dist/FinancialBrainMachinePrep.pkg
          pkgutil --check-signature dist/FinancialBrainMachinePrep.pkg | tee "$RUNNER_TEMP/signature.txt"
          if grep -q "Status: no signature" "$RUNNER_TEMP/signature.txt"; then
            echo "::error::productsign produced an unsigned package."
            exit 1
          fi
          if ! grep -Eq "^[[:space:]]*1\. Developer ID Installer: .* \($APPLE_TEAM_ID\)$" "$RUNNER_TEMP/signature.txt"; then
            echo "::error::the package's leaf certificate is not the Developer ID Installer identity of team $APPLE_TEAM_ID."
            exit 1
          fi
      - name: notarize, read the notary log, and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$key"
          xcrun notarytool submit dist/FinancialBrainMachinePrep.pkg \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/notary-submit.json"
          submission="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary-submit.json")"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary-submit.json")"
          xcrun notarytool log "$submission" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            "$RUNNER_TEMP/notary-log.json"
          rm -f "$key"
          cat "$RUNNER_TEMP/notary-log.json"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization finished with status $status; the notary log above names each issue."
            exit 1
          fi
          xcrun stapler staple dist/FinancialBrainMachinePrep.pkg
      - name: verify the exact distributed bytes
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun stapler validate dist/FinancialBrainMachinePrep.pkg
          spctl -a -vv -t install dist/FinancialBrainMachinePrep.pkg
          pkgutil --check-signature dist/FinancialBrainMachinePrep.pkg | tee "$RUNNER_TEMP/final-signature.txt"
          # Stapling rewrites the package, so the leaf is re-read from the exact
          # bytes that ship before any receipt vouches for them.
          if ! grep -Eq "^[[:space:]]*1\. Developer ID Installer: .* \($APPLE_TEAM_ID\)$" "$RUNNER_TEMP/final-signature.txt"; then
            echo "::error::the distributed package's leaf certificate is not the Developer ID Installer identity of team $APPLE_TEAM_ID. No receipt was written."
            exit 1
          fi
          # The uploaded artifact's root is dist/, so the receipt names the bare
          # file and `shasum -a 256 -c` works where the artifact is extracted.
          (cd dist && shasum -a 256 FinancialBrainMachinePrep.pkg | tee FinancialBrainMachinePrep.pkg.sha256)
      - name: upload the signed macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FinancialBrainMachinePrep-macOS-signed
          path: |
            dist/FinancialBrainMachinePrep.pkg
            dist/FinancialBrainMachinePrep.pkg.sha256
          retention-days: 14
      - name: delete the temporary signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          security delete-keychain "$RUNNER_TEMP/installer-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/devid-installer.p12" "$RUNNER_TEMP/notary-key.p8"

  windows-sign:
    name: sign the Windows MSI with Artifact Signing
    if: inputs.target == 'windows'
    runs-on: windows-latest
    environment: installer-signing
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: stop unless Artifact Signing is configured and the unsigned artifact is proven
        id: provenance
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          UNSIGNED_RUN_ID: ${{ inputs.unsigned_run_id }}
          UNSIGNED_ARTIFACT_ID: ${{ inputs.unsigned_artifact_id }}
          UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
          EXPECTED_ARTIFACT_NAME: FinancialBrainMachinePrep-unsigned.msi
          GH_TOKEN: ${{ github.token }}
        run: |
          $required = @(
            'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT_NAME', 'ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME',
            'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            Write-Output "::error::Windows installer signing is not configured yet. Add these installer-signing environment variables: $($missing -join ', '). Nothing was downloaded or signed."
            exit 1
          }
          if ($env:UNSIGNED_RUN_ID -notmatch '^[0-9]{1,20}$') {
            Write-Output "::error::unsigned_run_id must be the numeric run ID of a machine-prep-installers run. Nothing was downloaded or signed."
            exit 1
          }
          # The same provenance proof as the macOS job, byte for byte.
          $provenance = @'
          import { appendFileSync } from "node:fs";

          // Everything here reads the run and artifact records GitHub itself keeps.
          // A same-named artifact from any other run in this public repository,
          // including a fork's pull_request run, fails one of these comparisons.
          const env = process.env;
          const WORKFLOW_PATH = ".github/workflows/machine-prep-installers.yml";
          // The display name of the machine-prep-installers job that uploads each file.
          const PLATFORM_JOB = {
            "FinancialBrainMachinePrep-unsigned.pkg": "build unsigned macOS package",
            "FinancialBrainMachinePrep-unsigned.msi": "build unsigned Windows MSI",
          };
          class Refusal extends Error {}
          const refuse = (message) => { throw new Refusal(message); };

          async function prove() {
            const repository = env.GITHUB_REPOSITORY || "";
            const runId = env.UNSIGNED_RUN_ID || "";
            const artifactId = env.UNSIGNED_ARTIFACT_ID || "";
            const sha256 = env.UNSIGNED_SHA256 || "";
            const expectedName = env.EXPECTED_ARTIFACT_NAME || "";
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) refuse("GITHUB_REPOSITORY must be owner/name");
            if (!/^[1-9][0-9]{0,19}$/.test(runId)) refuse("unsigned_run_id must be the numeric run ID of a machine-prep-installers run");
            if (!/^[1-9][0-9]{0,19}$/.test(artifactId)) refuse("unsigned_artifact_id must be the numeric artifact ID that run reported");
            if (!/^[0-9a-f]{64}$/.test(sha256)) refuse("unsigned_sha256 must be the 64-character lowercase SHA-256 that run reported");
            if (!/^FinancialBrainMachinePrep-unsigned\.(?:pkg|msi)$/.test(expectedName)) refuse("EXPECTED_ARTIFACT_NAME must be an uploaded unsigned installer file name");
            const api = async (path) => {
              const response = await fetch(`${env.GITHUB_API_URL || "https://api.github.com"}${path}`, {
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: `Bearer ${env.GH_TOKEN || ""}`,
                  "x-github-api-version": "2022-11-28",
                },
              });
              if (!response.ok) refuse(`GitHub answered HTTP ${response.status} for ${path}`);
              return response.json();
            };
            // 404 is the one answer that proves absence; any other failure refuses.
            const apiUnlessMissing = async (path) => {
              const response = await fetch(`${env.GITHUB_API_URL || "https://api.github.com"}${path}`, {
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: `Bearer ${env.GH_TOKEN || ""}`,
                  "x-github-api-version": "2022-11-28",
                },
              });
              if (response.status === 404) return null;
              if (!response.ok) refuse(`GitHub answered HTTP ${response.status} for ${path}`);
              return response.json();
            };
            const jobName = PLATFORM_JOB[expectedName];
            const run = await api(`/repos/${repository}/actions/runs/${runId}`);
            if (String(run?.id) !== runId) refuse(`the API returned run ${run?.id}, not run ${runId}`);
            if (run.repository?.full_name !== repository) refuse(`run ${runId} belongs to another repository`);
            if (run.path !== WORKFLOW_PATH) refuse(`run ${runId} came from workflow ${run.path}, not ${WORKFLOW_PATH}`);
            if (run.event !== "workflow_dispatch") refuse(`run ${runId} was started by ${run.event}, not workflow_dispatch`);
            if (run.head_repository?.full_name !== repository) refuse(`run ${runId} built a head repository other than ${repository}`);
            if (run.head_branch !== "main") refuse(`run ${runId} built ${run.head_branch}, not main`);
            if (run.status !== "completed") {
              refuse(`run ${runId} is ${run.status}, not completed; the ${jobName} job must be completed with success`);
            }
            // head_branch is only a name: a dispatch on a tag called main also
            // reports "main". The run record carries no ref type, so the commit
            // it built must be the tip of the main branch or an ancestor of it,
            // and a main tag must not exist to make the name ambiguous.
            const headSha = String(run.head_sha || "");
            if (!/^[0-9a-f]{40}$/.test(headSha)) refuse(`run ${runId} has no 40-character head_sha`);
            const mainRef = await api(`/repos/${repository}/git/ref/heads/main`);
            const mainSha = String(mainRef?.object?.sha || "");
            if (mainRef?.ref !== "refs/heads/main" || mainRef?.object?.type !== "commit" || !/^[0-9a-f]{40}$/.test(mainSha)) {
              refuse("refs/heads/main did not resolve to a commit");
            }
            if (await apiUnlessMissing(`/repos/${repository}/git/ref/tags/main`) !== null) {
              refuse(`a tag named main exists in ${repository}, so run ${runId}'s head_branch "main" cannot be proven to be the main branch`);
            }
            // compare/{base}...{head} describes head relative to base: with main's
            // tip as base, an ancestor of main is "behind" and main itself is
            // "identical"; either way the merge base is the built commit.
            const comparison = await api(`/repos/${repository}/compare/${mainSha}...${headSha}`);
            if (!["behind", "identical"].includes(comparison?.status) || comparison.ahead_by !== 0 ||
                comparison.merge_base_commit?.sha !== headSha) {
              refuse(`run ${runId} built commit ${headSha}, which is not the tip of main or an ancestor of it (compare status ${comparison?.status})`);
            }
            // The default dispatch fails the Windows job on purpose (no WiX OSMF
            // confirmation), so the run's own conclusion cannot decide. The one
            // platform job that built this artifact must have succeeded.
            const jobList = await api(`/repos/${repository}/actions/runs/${runId}/jobs?per_page=100`);
            const jobs = Array.isArray(jobList?.jobs) ? jobList.jobs : [];
            if (jobList?.total_count !== jobs.length) {
              refuse(`run ${runId} lists ${jobList?.total_count} jobs but the API returned ${jobs.length}; an incomplete job list proves nothing`);
            }
            const platformJobs = jobs.filter((candidate) => candidate?.name === jobName);
            if (platformJobs.length !== 1) refuse(`run ${runId} has ${platformJobs.length} jobs named "${jobName}", not exactly one`);
            const [platformJob] = platformJobs;
            if (String(platformJob.run_id) !== runId) refuse(`the ${jobName} job belongs to run ${platformJob.run_id}, not run ${runId}`);
            if (platformJob.head_sha !== headSha) refuse(`the ${jobName} job built ${platformJob.head_sha}, not the run's head_sha ${headSha}`);
            if (platformJob.status !== "completed" || platformJob.conclusion !== "success") {
              refuse(`the ${jobName} job of run ${runId} is ${platformJob.status} with conclusion ${platformJob.conclusion}, not completed with success`);
            }
            const artifact = await api(`/repos/${repository}/actions/artifacts/${artifactId}`);
            if (String(artifact?.id) !== artifactId) refuse(`the API returned artifact ${artifact?.id}, not artifact ${artifactId}`);
            if (String(artifact.workflow_run?.id) !== runId) {
              refuse(`artifact ${artifactId} was uploaded by run ${artifact.workflow_run?.id}, not run ${runId}`);
            }
            if (artifact.name !== expectedName) refuse(`artifact ${artifactId} is named ${artifact.name}, not ${expectedName}`);
            if (artifact.expired !== false) refuse(`artifact ${artifactId} has expired`);
            if (artifact.digest !== `sha256:${sha256}`) {
              refuse(`artifact ${artifactId} digest ${artifact.digest} does not match the dispatched unsigned_sha256`);
            }
            appendFileSync(env.GITHUB_OUTPUT, `run_id=${runId}\nartifact_id=${artifactId}\n`);
            console.log(`artifact ${artifactId} (${expectedName}) is from the successful ${jobName} job of main workflow_dispatch run ${runId} at ${headSha}, SHA-256 ${sha256}`);
          }

          try {
            await prove();
          } catch (error) {
            const message = error instanceof Refusal ? error.message : `provenance could not be proven: ${error?.message || error}`;
            console.log(`::error::${message}. Nothing was downloaded or signed.`);
            process.exitCode = 1;
          }
          '@
          $provenance | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: download the reviewed unsigned Windows MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.provenance.outputs.artifact_id }}
          run-id: ${{ steps.provenance.outputs.run_id }}
          github-token: ${{ github.token }}
          path: unsigned
          skip-decompress: true
          digest-mismatch: error
      - name: verify the downloaded bytes against the dispatched SHA-256
        shell: pwsh
        env:
          UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
        run: |
          # node makes the decision so the test suite runs this exact program
          # without PowerShell. The digest must equal the one the gate proved.
          $rehash = @'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";

          const expected = process.env.UNSIGNED_SHA256 || "";
          let bytes;
          try {
            bytes = readFileSync("unsigned/FinancialBrainMachinePrep-unsigned.msi");
          } catch (error) {
            console.log(`::error::the downloaded MSI could not be read (${error?.code || "unknown error"}). Nothing was signed.`);
            process.exit(1);
          }
          const actual = createHash("sha256").update(bytes).digest("hex");
          if (!/^[0-9a-f]{64}$/.test(expected) || actual !== expected) {
            console.log(`::error::the downloaded MSI hashes to ${actual}, not the dispatched unsigned_sha256. Nothing was signed.`);
            process.exit(1);
          }
          console.log(`the downloaded MSI hashes to the dispatched unsigned_sha256 ${actual}`);
          '@
          $rehash | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: stage the MSI under its signed name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath unsigned/FinancialBrainMachinePrep-unsigned.msi -Destination dist/FinancialBrainMachinePrep.msi
      - name: sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: sign with Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\FinancialBrainMachinePrep.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # The shared Actions cache is writable by other workflows in this
          # repository; the signing tools are fetched fresh for every run.
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false
      - name: verify the Authenticode signature
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: Financial Brain LLC
        run: |
          $msi = Resolve-Path dist/FinancialBrainMachinePrep.msi
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne 'Valid') { throw "the MSI signature is $($signature.Status), not Valid" }
          if (-not $signature.TimeStamperCertificate) { throw "the MSI signature carries no timestamp" }
          # A valid signature from any other publisher is still the wrong one.
          # node parses the distinguished name so the test suite runs this exact
          # decision without PowerShell: exactly one O= attribute, equal to the
          # planned publisher, with quoted values and OU= kept apart.
          $env:SIGNER_SUBJECT = [string]$signature.SignerCertificate.Subject
          $publisherCheck = @'
          const subject = process.env.SIGNER_SUBJECT || "";
          const expected = process.env.EXPECTED_PUBLISHER || "";
          const stop = (message) => { console.log(`::error::${message}. Nothing was published.`); process.exit(1); };
          if (!expected) stop("EXPECTED_PUBLISHER is empty");
          // Split into attribute=value pairs at commas and plus signs outside quotes.
          const pairs = [];
          let current = "";
          let quoted = false;
          for (let index = 0; index < subject.length; index++) {
            const char = subject[index];
            if (char === "\\" && index + 1 < subject.length) { current += char + subject[++index]; continue; }
            if (char === '"') quoted = !quoted;
            if (!quoted && (char === "," || char === "+")) { pairs.push(current); current = ""; continue; }
            current += char;
          }
          if (quoted) stop(`the MSI signer subject could not be parsed: ${subject}`);
          pairs.push(current);
          const organizations = pairs.map((pair) => pair.trim()).filter((pair) => /^O=/i.test(pair)).map((pair) => {
            let value = pair.slice(2).trim();
            if (value.length >= 2 && value.startsWith('"') && value.endsWith('"')) value = value.slice(1, -1).replaceAll('""', '"');
            return value.replace(/\\(.)/g, "$1");
          });
          if (organizations.length !== 1 || organizations[0] !== expected) stop(`the MSI signer is ${subject}, not O=${expected}`);
          console.log(`the MSI signer's organization is ${expected}`);
          '@
          $publisherCheck | node --input-type=module -
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK" }
          & $signtool.FullName verify /pa /v $msi
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $msi
          $hash | Format-List
          "$($hash.Hash.ToLowerInvariant())  FinancialBrainMachinePrep.msi" | Set-Content -Encoding ascii dist/FinancialBrainMachinePrep.msi.sha256
      - name: upload the signed Windows MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FinancialBrainMachinePrep-Windows-signed
          path: |
            dist/FinancialBrainMachinePrep.msi
            dist/FinancialBrainMachinePrep.msi.sha256
          retention-days: 14
