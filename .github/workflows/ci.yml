# CI exists for ONE reason above all others: this installer has never run on
# Windows, and the first client install is on Windows. A green macOS run proves
# nothing about the platform that matters.
#
# The Windows job is not a nice-to-have here. Three of the defects found by
# review were Windows-specific (npm .cmd shims needing a shell since
# CVE-2024-27980, percent-encoded paths, PowerShell quoting), and every one was
# written from documentation rather than observation. This is the cheapest way
# to turn that inference into evidence.

name: ci

on:
  # Branch pushes keep their existing CI coverage. Version tags enter through
  # release.yml, which calls this same workflow and waits for every job before
  # it is allowed to create a draft release.
  push:
    branches:
      - "**"
      # This orphan branch has a separate Windows-only, CI-only rehearsal. It
      # must not allocate the paid private macOS runners in this release matrix.
      - "!codex/windows-rehearsal-plaid-20260906"
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_id:
        description: Immutable Actions artifact ID containing the tested raw package.
        value: ${{ jobs.package.outputs.artifact_id }}
      artifact_name:
        description: Exact raw package artifact tested by every matrix job.
        value: ${{ jobs.package.outputs.artifact_name }}
      package_sha256:
        description: Raw SHA-256 of the tested package bytes.
        value: ${{ jobs.package.outputs.package_sha256 }}
      package_version:
        description: Version encoded by the exact tested package.
        value: ${{ jobs.package.outputs.package_version }}
      package_bytes:
        description: Byte count of the exact tested package.
        value: ${{ jobs.package.outputs.package_bytes }}
      package_file_count:
        description: File count inside the exact tested package.
        value: ${{ jobs.package.outputs.package_file_count }}
      runtime_identity_artifact_id:
        description: Immutable artifact ID for the exact runtime identity receipt.
        value: ${{ jobs.package.outputs.runtime_identity_artifact_id }}
      runtime_identity_artifact_name:
        description: Exact raw runtime identity receipt artifact.
        value: ${{ jobs.package.outputs.runtime_identity_artifact_name }}
      runtime_identity_artifact_sha256:
        description: Raw SHA-256 of the runtime identity receipt bytes.
        value: ${{ jobs.package.outputs.runtime_identity_artifact_sha256 }}
      runtime_identity_artifact_bytes:
        description: Byte count of the runtime identity receipt.
        value: ${{ jobs.package.outputs.runtime_identity_artifact_bytes }}
      identity_scheme:
        description: Versioned scheme for the exact package runtime identity.
        value: ${{ jobs.package.outputs.identity_scheme }}
      runtime_payload_sha256:
        description: Runtime payload SHA-256 derived from the exact package archive.
        value: ${{ jobs.package.outputs.runtime_payload_sha256 }}

permissions:
  contents: read

jobs:
  history-privacy:
    name: public git history zero findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The scanner verifies the server-advertised refs with git ls-remote.
          # A private repository therefore needs the job's ephemeral, read-only
          # GITHUB_TOKEN until this step finishes; checkout removes it afterward.
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Scan every server-visible head and tag plus the checked-out commit. The
      # explicit HEAD covers a first push and pull-request merge commits that
      # are not yet advertised as ordinary origin refs. Zero means zero: this
      # clean lineage has no incident baseline or finding disposition path.
      - name: require zero findings in public and candidate history
        run: npm run privacy:history:remote

  # Build the package once. Every operating-system job below installs these
  # exact bytes, and the tag workflow publishes this same Actions artifact.
  # That closes the gap where six green jobs could each test a different pack
  # and release.yml could then build a seventh, never-tested tarball.
  package:
    name: build one exact package
    needs: history-privacy
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      package_sha256: ${{ steps.pack.outputs.package_sha256 }}
      package_version: ${{ steps.pack.outputs.package_version }}
      package_bytes: ${{ steps.pack.outputs.package_bytes }}
      package_file_count: ${{ steps.pack.outputs.package_file_count }}
      runtime_identity_artifact_id: ${{ steps.upload_runtime_identity.outputs.artifact-id }}
      runtime_identity_artifact_name: ${{ steps.pack.outputs.runtime_identity_artifact_name }}
      runtime_identity_artifact_sha256: ${{ steps.pack.outputs.runtime_identity_artifact_sha256 }}
      runtime_identity_artifact_bytes: ${{ steps.pack.outputs.runtime_identity_artifact_bytes }}
      identity_scheme: ${{ steps.pack.outputs.identity_scheme }}
      runtime_payload_sha256: ${{ steps.pack.outputs.runtime_payload_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.1'
          package-manager-cache: false

      - name: assert exact package producer toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          if [[ "$actual_node" != "v24.13.1" || "$actual_npm" != "11.8.0" ]]; then
            echo "::error::package producer is $actual_node / npm $actual_npm, expected v24.13.1 / npm 11.8.0"
            exit 1
          fi

      - name: install exact locked dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: reject private package inputs before upload
        run: node test/package-privacy.test.mjs --scan-only

      - name: pack once and bind the raw bytes
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          checkout_commit="$(git rev-parse 'HEAD^{commit}')"
          event_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [[ "$checkout_commit" != "$event_commit" ]]; then
            echo "::error::package checkout $checkout_commit does not match event $event_commit"
            exit 1
          fi

          package_dir="$RUNNER_TEMP/exact-package"
          mkdir -p "$package_dir"
          npm pack --json --ignore-scripts --pack-destination "$package_dir" \
            > "$package_dir/npm-pack.json"

          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package version is malformed"
            exit 1
          fi
          expected_name="brain-installer-$package_version.tgz"
          artifact_name="$(node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.length !== 1 || typeof report[0]?.filename !== "string") {
              throw new Error("npm pack did not report exactly one package");
            }
            process.stdout.write(report[0].filename);
          ' "$package_dir/npm-pack.json")"
          if [[ "$artifact_name" != "$expected_name" ]]; then
            echo "::error::npm packed $artifact_name, expected $expected_name"
            exit 1
          fi

          package_path="$package_dir/$artifact_name"
          bundle_proof_path="$package_dir/package-bundle-proof.json"
          node scripts/verify-package-bundles.mjs \
            --package "$package_path" \
            --metadata "$package_dir/npm-pack.json" \
            --json > "$bundle_proof_path"
          package_sha256="$(node -e '
            const fs = require("node:fs");
            const proof = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (proof.status !== "passed" || typeof proof.archive_sha256 !== "string") {
              throw new Error("bundle verifier did not return a package digest");
            }
            process.stdout.write(proof.archive_sha256);
          ' "$bundle_proof_path")"
          if [[ ! "$package_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::package SHA-256 is malformed"
            exit 1
          fi
          package_bytes="$(node -e '
            const fs = require("node:fs");
            const proof = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Number.isSafeInteger(proof.archive_bytes) || proof.archive_bytes < 1) {
              throw new Error("bundle verifier did not return a package byte count");
            }
            process.stdout.write(String(proof.archive_bytes));
          ' "$bundle_proof_path")"
          package_file_count="$(node -e '
            const fs = require("node:fs");
            const proof = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Number.isSafeInteger(proof.archive_file_count) || proof.archive_file_count < 1) {
              throw new Error("bundle verifier did not return a package file count");
            }
            process.stdout.write(String(proof.archive_file_count));
          ' "$bundle_proof_path")"
          runtime_identity_artifact_name="brain-installer-$package_version-runtime-identity.json"
          runtime_identity_artifact_path="$package_dir/$runtime_identity_artifact_name"
          runtime_identity_metadata_path="$package_dir/runtime-identity-artifact-metadata.json"
          node scripts/runtime-identity-receipt.mjs \
            --create receipt \
            --proof "$bundle_proof_path" \
            --source-sha "$checkout_commit" \
            --package-filename "$artifact_name" \
            --package-version "$package_version" \
            --output "$runtime_identity_artifact_path" \
            > "$runtime_identity_metadata_path"
          identity_scheme="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (value.status !== "passed" || value.identity_scheme !== "brain.runtime-payload.sha256.v1") {
              throw new Error("runtime identity scheme is missing or unexpected");
            }
            process.stdout.write(value.identity_scheme);
          ' "$runtime_identity_metadata_path")"
          runtime_payload_sha256="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!/^[0-9a-f]{64}$/.test(String(value.runtime_payload_sha256 || ""))) {
              throw new Error("runtime payload SHA-256 is malformed");
            }
            process.stdout.write(value.runtime_payload_sha256);
          ' "$runtime_identity_metadata_path")"
          runtime_identity_artifact_sha256="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!/^[0-9a-f]{64}$/.test(String(value.artifact_sha256 || ""))) {
              throw new Error("runtime identity artifact SHA-256 is malformed");
            }
            process.stdout.write(value.artifact_sha256);
          ' "$runtime_identity_metadata_path")"
          runtime_identity_artifact_bytes="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Number.isSafeInteger(value.artifact_bytes) || value.artifact_bytes < 1) {
              throw new Error("runtime identity artifact byte count is malformed");
            }
            process.stdout.write(String(value.artifact_bytes));
          ' "$runtime_identity_metadata_path")"

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$package_sha256" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "package_bytes=$package_bytes" >> "$GITHUB_OUTPUT"
          echo "package_file_count=$package_file_count" >> "$GITHUB_OUTPUT"
          echo "runtime_identity_artifact_name=$runtime_identity_artifact_name" >> "$GITHUB_OUTPUT"
          echo "runtime_identity_artifact_path=$runtime_identity_artifact_path" >> "$GITHUB_OUTPUT"
          echo "runtime_identity_artifact_sha256=$runtime_identity_artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "runtime_identity_artifact_bytes=$runtime_identity_artifact_bytes" >> "$GITHUB_OUTPUT"
          echo "identity_scheme=$identity_scheme" >> "$GITHUB_OUTPUT"
          echo "runtime_payload_sha256=$runtime_payload_sha256" >> "$GITHUB_OUTPUT"
          echo "packed $artifact_name: version $package_version, $package_bytes bytes, $package_file_count files, sha256:$package_sha256, runtime $identity_scheme sha256:$runtime_payload_sha256"

      # v7 can store one file without a ZIP wrapper. The artifact digest is
      # therefore the package's digest, not the digest of a transport archive.
      - name: upload the raw package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.package_path }}
          archive: false
          if-no-files-found: error
          # A rerun creates a new immutable ID. Because raw uploads use the
          # file basename as their artifact name, this replaces only the prior
          # attempt's artifact with that same exact basename.
          overwrite: true
          retention-days: 7

      - name: upload the raw runtime identity receipt
        id: upload_runtime_identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.runtime_identity_artifact_name }}
          path: ${{ steps.pack.outputs.runtime_identity_artifact_path }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: verify the uploaded raw digest
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          LOCAL_SHA256: ${{ steps.pack.outputs.package_sha256 }}
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          RUNTIME_IDENTITY_ARTIFACT_ID: ${{ steps.upload_runtime_identity.outputs.artifact-id }}
          LOCAL_RUNTIME_IDENTITY_SHA256: ${{ steps.pack.outputs.runtime_identity_artifact_sha256 }}
          RUNTIME_IDENTITY_UPLOAD_DIGEST: ${{ steps.upload_runtime_identity.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::uploaded artifact ID is malformed"
            exit 1
          fi
          uploaded_sha256="${UPLOAD_DIGEST#sha256:}"
          if [[ "$uploaded_sha256" != "$LOCAL_SHA256" ]]; then
            echo "::error::uploaded artifact digest does not match the package bytes"
            exit 1
          fi
          if [[ ! "$RUNTIME_IDENTITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::uploaded runtime identity artifact ID is malformed"
            exit 1
          fi
          uploaded_runtime_identity_sha256="${RUNTIME_IDENTITY_UPLOAD_DIGEST#sha256:}"
          if [[ "$uploaded_runtime_identity_sha256" != "$LOCAL_RUNTIME_IDENTITY_SHA256" ]]; then
            echo "::error::uploaded runtime identity digest does not match the receipt bytes"
            exit 1
          fi

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the Windows job because macOS failed. Windows is the one we
      # are actually here to learn from.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['22', '24']
    steps:
      # Pin third-party actions to reviewed commits. A mutable major tag can
      # change underneath an otherwise identical installer release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # This job does not need shared dependency-cache state. Keeping the
          # cache off also removes a cache-poisoning input from release CI.
          package-manager-cache: false

      # UPDATE-026: assert the runtime before anything installs, so a green lane
      # cannot silently mean "ran somewhere else". x64 is the only architecture
      # 0.4.0 claims on any OS; ARM64 is deferred and unproven.
      - name: assert the runtime before install
        shell: bash
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
          EXPECTED_OS: ${{ matrix.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          node -e '
            const expectedMajor = process.env.EXPECTED_NODE_MAJOR;
            const expectedOs = process.env.EXPECTED_OS;
            const runnerArch = process.env.RUNNER_ARCH;
            const platformFor = { "windows-latest": "win32", "macos-latest": "darwin", "ubuntu-latest": "linux" };
            // macos-latest is Apple Silicon, which is also what clients run on a
            // Mac, so arm64 is the CORRECT architecture there and asserting x64
            // would reject the very runtime we support. Windows stays x64 only:
            // UPDATE-012 defers Windows ARM64 as unproven and 0.4.0 does not
            // claim it, so a Windows lane on ARM64 would be a real problem.
            const archFor = { "windows-latest": "X64", "macos-latest": "ARM64", "ubuntu-latest": "X64" };
            const expectedPlatform = platformFor[expectedOs];
            const expectedArch = archFor[expectedOs];
            const actual = {
              runner_arch: runnerArch,
              os: expectedOs,
              platform: process.platform,
              arch: process.arch,
              node_major: process.versions.node.split(".")[0],
              node: process.versions.node,
            };
            console.log("RUNTIME " + JSON.stringify(actual));
            const problems = [];
            if (!expectedPlatform) problems.push(`unmapped runner image ${expectedOs}`);
            else if (process.platform !== expectedPlatform) problems.push(`platform ${process.platform}, expected ${expectedPlatform}`);
            if (runnerArch !== expectedArch) problems.push(`runner arch ${runnerArch}, expected ${expectedArch}`);
            if (process.arch !== expectedArch.toLowerCase()) problems.push(`node arch ${process.arch}, expected ${expectedArch.toLowerCase()}`);
            if (actual.node_major !== expectedMajor) problems.push(`node major ${actual.node_major}, expected ${expectedMajor}`);
            if (problems.length) {
              console.error("this lane is not the runtime it claims to be: " + problems.join("; "));
              process.exit(1);
            }
          '

      # v8 understands the raw, unarchived artifact emitted by upload-artifact
      # v7. Resolve the producer's immutable artifact ID, then independently hash
      # the downloaded .tgz before any install command can touch it.
      - name: download the one shared raw package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: .release-package
          skip-decompress: true
          digest-mismatch: error

      - name: download the matching raw runtime identity receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.runtime_identity_artifact_id }}
          path: .release-runtime-identity
          skip-decompress: true
          digest-mismatch: error

      - name: verify exact shared package bytes
        id: verify_package
        env:
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ needs.package.outputs.package_sha256 }}
          EXPECTED_PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
          EXPECTED_PACKAGE_BYTES: ${{ needs.package.outputs.package_bytes }}
          EXPECTED_PACKAGE_FILE_COUNT: ${{ needs.package.outputs.package_file_count }}
          RUNTIME_IDENTITY_ARTIFACT_NAME: ${{ needs.package.outputs.runtime_identity_artifact_name }}
          EXPECTED_RUNTIME_IDENTITY_ARTIFACT_SHA256: ${{ needs.package.outputs.runtime_identity_artifact_sha256 }}
          EXPECTED_RUNTIME_IDENTITY_ARTIFACT_BYTES: ${{ needs.package.outputs.runtime_identity_artifact_bytes }}
          EXPECTED_IDENTITY_SCHEME: ${{ needs.package.outputs.identity_scheme }}
          EXPECTED_RUNTIME_PAYLOAD_SHA256: ${{ needs.package.outputs.runtime_payload_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tgz=".release-package/$ARTIFACT_NAME"
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const [path, expected, expectedBytes] = process.argv.slice(1);
            if (!/^[0-9a-f]{64}$/.test(expected)) throw new Error("expected package SHA-256 is malformed");
            if (!/^[1-9][0-9]*$/.test(expectedBytes)) throw new Error("expected package byte count is malformed");
            const byteCount = Number(expectedBytes);
            if (!Number.isSafeInteger(byteCount) || fs.statSync(path).size !== byteCount) {
              throw new Error("package byte count does not match the producer receipt");
            }
            const actual = crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
            if (actual !== expected) throw new Error(`package SHA-256 ${actual} does not match ${expected}`);
          ' "$tgz" "$EXPECTED_SHA256" "$EXPECTED_PACKAGE_BYTES"
          if [[ ! "$EXPECTED_PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ||
                "$ARTIFACT_NAME" != "brain-installer-$EXPECTED_PACKAGE_VERSION.tgz" ||
                "$RUNTIME_IDENTITY_ARTIFACT_NAME" != "brain-installer-$EXPECTED_PACKAGE_VERSION-runtime-identity.json" ||
                ! "$EXPECTED_PACKAGE_FILE_COUNT" =~ ^[1-9][0-9]*$ ||
                "$EXPECTED_IDENTITY_SCHEME" != "brain.runtime-payload.sha256.v1" ||
                ! "$EXPECTED_RUNTIME_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::shared package identity outputs are malformed or inconsistent"
            exit 1
          fi
          node scripts/runtime-identity-receipt.mjs \
            --verify receipt \
            --receipt ".release-runtime-identity/$RUNTIME_IDENTITY_ARTIFACT_NAME" \
            --artifact-sha256 "$EXPECTED_RUNTIME_IDENTITY_ARTIFACT_SHA256" \
            --artifact-bytes "$EXPECTED_RUNTIME_IDENTITY_ARTIFACT_BYTES" \
            --source-sha "$GITHUB_SHA" \
            --package-filename "$ARTIFACT_NAME" \
            --package-version "$EXPECTED_PACKAGE_VERSION" \
            --package-bytes "$EXPECTED_PACKAGE_BYTES" \
            --package-file-count "$EXPECTED_PACKAGE_FILE_COUNT" \
            --package-sha256 "$EXPECTED_SHA256" \
            --identity-scheme "$EXPECTED_IDENTITY_SCHEME" \
            --runtime-payload-sha256 "$EXPECTED_RUNTIME_PAYLOAD_SHA256"
          echo "TARBALL=$tgz" >> "$GITHUB_ENV"
          echo "BRAIN_TESTED_PACKAGE_FILENAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "BRAIN_TESTED_PACKAGE_VERSION=$EXPECTED_PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "BRAIN_TESTED_PACKAGE_BYTES=$EXPECTED_PACKAGE_BYTES" >> "$GITHUB_ENV"
          echo "BRAIN_TESTED_PACKAGE_FILE_COUNT=$EXPECTED_PACKAGE_FILE_COUNT" >> "$GITHUB_ENV"
          echo "BRAIN_TESTED_PACKAGE_SHA256=$EXPECTED_SHA256" >> "$GITHUB_ENV"
          echo "BRAIN_TESTED_RUNTIME_IDENTITY_SCHEME=$EXPECTED_IDENTITY_SCHEME" >> "$GITHUB_ENV"
          echo "BRAIN_TESTED_RUNTIME_PAYLOAD_SHA256=$EXPECTED_RUNTIME_PAYLOAD_SHA256" >> "$GITHUB_ENV"
          echo "verified $ARTIFACT_NAME at sha256:$EXPECTED_SHA256"

      # The operator runs preflight from the installed release, not from a
      # source checkout. Extract both scripts and their manifest-selector helper
      # from the one shared artifact so every matrix job proves those exact
      # bytes were actually packaged.
      - name: extract preflight from exact package
        shell: bash
        run: |
          set -euo pipefail
          tarball="$TARBALL"
          if command -v cygpath >/dev/null 2>&1; then
            tarball=$(cygpath -u "$tarball")
          fi
          mkdir -p .packaged-preflight
          tar -xzf "$tarball" -C .packaged-preflight \
            package/tools/preflight.sh package/tools/preflight.ps1 \
            package/operations/installed-manifest.mjs
          test -f .packaged-preflight/package/tools/preflight.sh
          test -f .packaged-preflight/package/tools/preflight.ps1
          test -f .packaged-preflight/package/operations/installed-manifest.mjs
          echo "packaged preflight scripts and manifest selector extracted from $(basename "$tarball")"

      # --ignore-scripts is what the client is told to run, so CI runs the same
      # thing. If a dependency needs a postinstall script, better to find out
      # here than on someone's laptop.
      - name: install
        run: npm ci --ignore-scripts

      # The browser installer, Settings update notice, owner workspace, and
      # connector recovery states live in a separate React dependency graph.
      # Backend tests cannot prove that graph compiles or that its interaction
      # contracts still pass, so install and exercise it explicitly.
      - name: install owner app
        run: npm ci --prefix frontend --ignore-scripts

      - name: parse checked-in Windows owner rehearsal launcher
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\onboarding\start-windows-rehearsal.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'the checked-in Windows owner rehearsal launcher did not parse'
          }

      # Exercise the same Node rehearsal through the existing bounded npm smoke,
      # but keep CI synthetic and headless. The physical owner uses the parsed
      # launcher above so Control-C does not cross the npm.cmd batch shim. Hosted
      # runners are elevated, so this proves build, loopback guide/app/API, and
      # clean exit rather than the non-admin or automatic-browser field gates.
      - name: Windows synthetic onboarding smoke
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: npm.cmd run rehearse:onboarding -- --smoke --no-open

      - name: owner app tests
        run: npm --prefix frontend test

      # The browser harness serves frontend/dist. Build it on the clean runner
      # before Playwright starts, while preserving the reviewed Worker parity
      # check as the authority for the generated asset module.
      - name: owner app production bundle parity
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run build
          git diff --exit-code -- worker/src/lib/app-assets.js

      - name: install owner browser test runtime
        if: ${{ !cancelled() }}
        run: npm --prefix frontend run test:browser:install

      - name: owner scope browser regressions
        if: ${{ !cancelled() }}
        run: npm --prefix frontend run test:browser

      # Fresh random bytes exercise 25 protect/unprotect round trips through one
      # private process-scoped compiled helper, followed by exact captured-identity
      # cleanup. The wrapper emits stable stage codes and counts only, never input,
      # ciphertext, child output, or a credential. This is release evidence, not
      # the supervised client gate.
      - name: Windows DPAPI 25-round release gate
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node scripts/windows-dpapi-release-gate.mjs

      - name: unit and integration suite
        if: ${{ !cancelled() }}
        run: npm test -- --continue-on-failure

      # Keep incident regressions visible even when another independent check
      # fails. This is automated proof, not release clearance.
      - name: independent incident regressions
        if: ${{ !cancelled() }}
        run: npm run audit:regressions

      # GitHub-hosted Windows runners are elevated. Require the packaged
      # production script to parse, execute, and refuse that unsafe context for
      # exactly the reason a customer would see. This is not a preflight bypass.
      - name: packaged preflight runs and prints (Windows)
        if: ${{ !cancelled() && steps.verify_package.outcome == 'success' && runner.os == 'Windows' }}
        shell: powershell
        run: |
          $path = Resolve-Path .\.packaged-preflight\package\tools\preflight.ps1
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File $path 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "preflight exit: $code"
          if ($out -notmatch 'Financial Brain preflight') { throw 'packaged preflight did not run' }
          if ($out -notmatch 'STOP.*running as Administrator') { throw 'packaged preflight must refuse the elevated hosted runner' }
          if ($out -notmatch 'ok.*this process has no Windows package identity') { throw 'packaged preflight did not prove the hosted PowerShell process is outside an app package' }
          if ($code -ne 1) { throw "the packaged Administrator STOP must exit 1, got $code" }
          $e=$null; $t=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$t, [ref]$e) | Out-Null
          if ($e.Count -gt 0) { $e | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "preflight.ps1 parsed clean"
          # Hosted Windows runners are elevated, so the preflight correctly
          # exits 1. This smoke step checks execution and parsing, not readiness.
          exit 0

      - name: packaged preflight runs and prints (macOS and Linux)
        if: ${{ !cancelled() && steps.verify_package.outcome == 'success' && runner.os != 'Windows' }}
        shell: bash
        run: |
          set +e
          out=$(bash .packaged-preflight/package/tools/preflight.sh 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          echo "preflight exit: $code"
          printf '%s\n' "$out" | grep -q 'Financial Brain preflight' || { echo "::error::packaged preflight did not run"; exit 1; }
          bash -n .packaged-preflight/package/tools/preflight.sh
          echo "preflight.sh parsed clean"

      # The CLI must START. On Windows a symlinked bin, a percent-encoded path
      # or a .cmd shim can make it exit 0 having done nothing, which is worse
      # than crashing because every exit-code check passes.
      - name: cli starts and prints usage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          out=$(node brain.mjs)
          echo "$out"
          echo "$out" | grep -Eq 'brain setup|setup[[:space:]]+\[manifest\]' || { echo "::error::usage did not print"; exit 1; }

      # doctor must RUN and report, with no Cloudflare credentials present. It
      # is expected to report failures here; what is NOT acceptable is a crash,
      # because doctor is the tool whose whole job is diagnosing a bare machine.
      - name: doctor reports rather than crashing
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          out=$(node brain.mjs doctor 2>&1); code=$?
          echo "$out"
          echo "$out" | grep -q "Node" || { echo "::error::doctor produced no report"; exit 1; }
          echo "$out" | grep -qi "cannot find module" && { echo "::error::doctor crashed on imports"; exit 1; }
          echo "doctor exited $code, which is expected without credentials"
          exit 0

      # The real client entry point is a global install of the packed tarball,
      # not `node brain.mjs`. That path has its own failure modes (bin symlink
      # resolution, the shebang, PATHEXT on Windows) that direct invocation
      # never exercises, and one of them already shipped once: the installed
      # command ran and did nothing, exit 0.
      - name: packed tarball installs globally and the bin works
        if: ${{ !cancelled() && steps.verify_package.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "$TARBALL"

          # Locate the bin explicitly rather than trusting PATH: on Windows npm
          # writes brain.cmd into the prefix root, on POSIX a symlink into bin/.
          prefix=$(npm prefix -g)
          if [ -x "$prefix/bin/brain" ]; then bin="$prefix/bin/brain";
          elif [ -f "$prefix/brain.cmd" ]; then bin="$prefix/brain.cmd";
          elif command -v brain >/dev/null 2>&1; then bin="brain";
          else echo "::error::no brain bin found under $prefix"; ls -la "$prefix" "$prefix/bin" 2>/dev/null; exit 1; fi
          echo "bin: $bin"

          out=$("$bin")
          echo "$out"
          echo "$out" | grep -Eq 'brain setup|setup[[:space:]]+\[manifest\]' || { echo "::error::installed bin ran but printed nothing"; exit 1; }

      # The public guide uses a user-owned prefix. That avoids sudo/EACCES on
      # Mac and Linux and keeps Windows inside the current profile. Exercise
      # that exact shape as well as the traditional global install above.
      - name: packed tarball installs in a user-owned prefix
        if: ${{ !cancelled() && steps.verify_package.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/financial-brain-cli"
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund "$TARBALL"
          if [ -x "$prefix/bin/brain" ]; then bin="$prefix/bin/brain";
          elif [ -f "$prefix/brain.cmd" ]; then bin="$prefix/brain.cmd";
          else echo "::error::no user-prefix brain bin found"; exit 1; fi
          out=$("$bin")
          echo "$out"
          echo "$out" | grep -Eq 'brain setup|setup[[:space:]]+\[manifest\]' || { echo "::error::user-prefix bin did not run"; exit 1; }

      # The checkout probe above catches source-tree regressions. Release proof
      # must also come from the exact globally installed tarball, including
      # synthetic admin-key create, read, rotation, and ciphertext inspection.
      - name: packed Windows DPAPI and admin-key release gate
        if: ${{ !cancelled() && steps.verify_package.outcome == 'success' && runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/financial-brain-cli"
          package_root="$(npm root --global --prefix "$prefix")/brain-installer"
          test -f "$package_root/scripts/windows-dpapi-release-gate.mjs"
          node "$package_root/scripts/windows-dpapi-release-gate.mjs"

      # PowerShell can block npm.ps1/npx.ps1 under its default execution
      # policy. The website therefore uses the .cmd shims explicitly on
      # Windows, and CI must prove that exact beginner path.
      - name: Windows PowerShell user-prefix command works
        if: ${{ !cancelled() && steps.verify_package.outcome == 'success' && runner.os == 'Windows' }}
        env:
          PACKAGE_FILENAME: ${{ needs.package.outputs.artifact_name }}
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'financial-brain-powershell'
          $tarball = Join-Path '.release-package' $env:PACKAGE_FILENAME
          npm.cmd install --global --prefix $prefix --ignore-scripts --no-audit --no-fund $tarball
          if ($LASTEXITCODE -ne 0) { throw "package install failed: $LASTEXITCODE" }
          $out = & (Join-Path $prefix 'brain.cmd')
          $code = $LASTEXITCODE
          $out = $out | Out-String
          $out
          if ($code -ne 0) { throw "installed command failed: $code" }
          if ($out -notmatch 'brain setup|setup\s+\[manifest\]') { throw 'PowerShell user-prefix bin did not run' }

      # The receipt above proves what was inside the archive. npm creates the
      # Windows command shims only while installing, so prove the resulting
      # package tree separately and then enter the preview grammar through the
      # actual installed brain.cmd. The isolated nonexistent home makes the CLI
      # stop after runtime proof because no Brain manifest exists; its one closed
      # JSON refusal must still prove that it read no credential, contacted no
      # network, and performed no application write.
      - name: Windows installed runtime identity and preview boundary
        if: ${{ !cancelled() && steps.verify_package.outcome == 'success' && runner.os == 'Windows' }}
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'financial-brain-powershell'
          $brain = Join-Path $prefix 'brain.cmd'
          $packageRoot = Join-Path $prefix 'node_modules\brain-installer'
          if (-not (Test-Path -LiteralPath $brain -PathType Leaf)) {
            throw 'the installed brain.cmd entrypoint is missing'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'brain.mjs') -PathType Leaf)) {
            throw 'the installed package entrypoint is missing'
          }

          $env:BRAIN_INSTALLED_ENTRYPOINT = (Resolve-Path -LiteralPath $brain).Path
          $env:BRAIN_INSTALLED_PACKAGE_ROOT = (Resolve-Path -LiteralPath $packageRoot).Path
          $env:BRAIN_REVIEWED_SOURCE_ROOT = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $env:BRAIN_EXPECTED_NODE_MAJOR = $env:EXPECTED_NODE_MAJOR
          $env:BRAIN_EXPECTED_PACKAGE_VERSION = $env:BRAIN_TESTED_PACKAGE_VERSION
          $env:BRAIN_EXPECTED_PACKAGE_FILE_COUNT = $env:BRAIN_TESTED_PACKAGE_FILE_COUNT
          $env:BRAIN_EXPECTED_RUNTIME_SHA256 = $env:BRAIN_TESTED_RUNTIME_PAYLOAD_SHA256
          $runtimeProofScript = @'
          const { createHash } = await import("node:crypto");
          const { lstatSync, readFileSync } = await import("node:fs");
          const { basename, dirname, join } = await import("node:path");
          const { pathToFileURL } = await import("node:url");

          const root = process.env.BRAIN_INSTALLED_PACKAGE_ROOT;
          const entrypoint = process.env.BRAIN_INSTALLED_ENTRYPOINT;
          const reviewedRoot = process.env.BRAIN_REVIEWED_SOURCE_ROOT;
          const expectedVersion = process.env.BRAIN_EXPECTED_PACKAGE_VERSION;
          const expectedRuntime = process.env.BRAIN_EXPECTED_RUNTIME_SHA256;
          const expectedNodeMajor = process.env.BRAIN_EXPECTED_NODE_MAJOR;
          const expectedFileCountText = process.env.BRAIN_EXPECTED_PACKAGE_FILE_COUNT;
          if (!root || !entrypoint || !reviewedRoot ||
              !/^\d+\.\d+\.\d+$/.test(expectedVersion || "") ||
              !/^[a-f0-9]{64}$/.test(expectedRuntime || "") ||
              !/^[1-9][0-9]*$/.test(expectedFileCountText || "") ||
              !/^(?:22|24)$/.test(expectedNodeMajor || "")) {
            throw new Error("the installed runtime expectations are malformed");
          }
          if (process.platform !== "win32" || process.arch !== "x64" ||
              process.versions.node.split(".")[0] !== expectedNodeMajor) {
            throw new Error("the installed runtime process does not match its Windows lane");
          }

          const packageManifest = JSON.parse(readFileSync(join(root, "package.json"), "utf8"));
          if (packageManifest.name !== "brain-installer" ||
              packageManifest.version !== expectedVersion ||
              packageManifest.bin?.brain !== "./brain.mjs") {
            throw new Error("the installed package identity is not exact");
          }
          if (basename(entrypoint).toLowerCase() !== "brain.cmd") {
            throw new Error("the selected installed command is not brain.cmd");
          }
          const brainModule = await import(pathToFileURL(join(reviewedRoot, "brain.mjs")).href);
          const runtimeModule = await import(
            pathToFileURL(join(reviewedRoot, "operations", "update-preview.mjs")).href
          );
          const allowlist = brainModule.provenanceTargetRuntimePackageFiles({ root });
          const proof = runtimeModule.verifyUpdateRuntimePayload({
            root,
            allowlist,
            expectedRuntimeSha256: expectedRuntime,
            platform: "win32",
          });
          const expectedFileCount = Number(expectedFileCountText);
          if (proof.schema_version !== 1 ||
              proof.identity_scheme !== "brain.runtime-payload.sha256.v1" ||
              proof.runtime_payload_sha256 !== expectedRuntime ||
              proof.expected_runtime_sha256 !== expectedRuntime ||
              proof.verified_passes !== 2 || proof.file_count !== expectedFileCount ||
              !Number.isSafeInteger(proof.total_bytes) || proof.total_bytes < 1) {
            throw new Error("the installed runtime proof does not match the sealed package receipt");
          }

          if (runtimeModule.WINDOWS_NODE_LAUNCHER_TEMPLATE !==
              "npm.cmd-shim-8.windows-node.v1") {
            throw new Error("the reviewed Windows launcher template is unexpected");
          }
          const targetBytes = readFileSync(join(root, "brain.mjs"));
          let expectedLaunchers;
          const launcherFacts = {};
          try {
            expectedLaunchers = runtimeModule.expectedWindowsNodeLauncherBytes({
              launcherDirectory: ".",
              payloadTarget: "node_modules/brain-installer/brain.mjs",
              targetBytes,
            });
            for (const [name, templateKey] of [
              ["brain", "plain"], ["brain.cmd", "cmd"], ["brain.ps1", "powershell"],
            ]) {
              const launcherPath = join(dirname(entrypoint), name);
              const before = lstatSync(launcherPath);
              if (!before.isFile() || before.isSymbolicLink() || before.nlink !== 1 ||
                  !Number.isSafeInteger(before.size) || before.size < 1) {
                throw new Error("an installed Windows launcher is not one direct regular file");
              }
              const actual = readFileSync(launcherPath);
              try {
                if (!actual.equals(expectedLaunchers[templateKey])) {
                  throw new Error("an installed Windows launcher differs from the reviewed template");
                }
                const after = lstatSync(launcherPath);
                if (!after.isFile() || after.isSymbolicLink() || after.nlink !== 1 ||
                    after.size !== before.size || after.dev !== before.dev ||
                    after.ino !== before.ino || after.mtimeMs !== before.mtimeMs ||
                    after.ctimeMs !== before.ctimeMs) {
                  throw new Error("an installed Windows launcher changed during verification");
                }
                launcherFacts[name] = {
                  bytes: actual.length,
                  sha256: createHash("sha256").update(actual).digest("hex"),
                };
              } finally {
                actual.fill(0);
              }
            }
          } finally {
            targetBytes.fill(0);
            expectedLaunchers?.plain.fill(0);
            expectedLaunchers?.cmd.fill(0);
            expectedLaunchers?.powershell.fill(0);
          }
          const receipt = {
            schema_version: 1,
            status: "installed_runtime_verified",
            package_name: packageManifest.name,
            package_version: packageManifest.version,
            package_entrypoint: packageManifest.bin.brain,
            installed_entrypoint: "brain.cmd",
            installed_launcher_count: 3,
            installed_brain_bytes: launcherFacts.brain.bytes,
            installed_brain_sha256: launcherFacts.brain.sha256,
            installed_brain_cmd_bytes: launcherFacts["brain.cmd"].bytes,
            installed_brain_cmd_sha256: launcherFacts["brain.cmd"].sha256,
            installed_brain_ps1_bytes: launcherFacts["brain.ps1"].bytes,
            installed_brain_ps1_sha256: launcherFacts["brain.ps1"].sha256,
            launcher_template: runtimeModule.WINDOWS_NODE_LAUNCHER_TEMPLATE,
            platform: process.platform,
            architecture: process.arch,
            node_major: expectedNodeMajor,
            identity_scheme: proof.identity_scheme,
            runtime_payload_sha256: proof.runtime_payload_sha256,
            runtime_file_count: proof.file_count,
            runtime_bytes: proof.total_bytes,
            verified_passes: proof.verified_passes,
          };
          process.stdout.write(JSON.stringify(receipt));
          '@
          $runtimeJson = & node --input-type=module -e $runtimeProofScript
          if ($LASTEXITCODE -ne 0) { throw "installed runtime verification failed: $LASTEXITCODE" }
          $runtimeReceipt = $runtimeJson | ConvertFrom-Json
          $runtimeKeys = @($runtimeReceipt.PSObject.Properties.Name | Sort-Object)
          $expectedRuntimeKeys = @(
            'architecture', 'identity_scheme', 'installed_entrypoint',
            'installed_brain_bytes', 'installed_brain_cmd_bytes',
            'installed_brain_cmd_sha256', 'installed_brain_ps1_bytes',
            'installed_brain_ps1_sha256', 'installed_brain_sha256',
            'installed_launcher_count', 'launcher_template', 'node_major',
            'package_entrypoint', 'package_name', 'package_version', 'platform',
            'runtime_bytes', 'runtime_file_count', 'runtime_payload_sha256',
            'schema_version', 'status', 'verified_passes'
          ) | Sort-Object
          if (($runtimeKeys -join ',') -cne ($expectedRuntimeKeys -join ',')) {
            throw 'the installed runtime receipt shape is not closed'
          }
          Write-Host "INSTALLED_RUNTIME $runtimeJson"

          $emptyRoot = Join-Path $env:RUNNER_TEMP "brain-update-preview-empty-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:EXPECTED_NODE_MAJOR"
          $emptyHome = Join-Path $emptyRoot 'home'
          $emptyAppData = Join-Path $emptyRoot 'appdata'
          $emptyLocalAppData = Join-Path $emptyRoot 'localappdata'
          foreach ($path in @($emptyRoot, (Join-Path $env:RUNNER_TEMP 'brain.manifest.json'))) {
            if (Test-Path -LiteralPath $path) {
              throw 'the no-manifest update-preview isolation path was not empty'
            }
          }
          $env:HOME = $emptyHome
          $env:USERPROFILE = $emptyHome
          $env:APPDATA = $emptyAppData
          $env:LOCALAPPDATA = $emptyLocalAppData
          Push-Location $env:RUNNER_TEMP
          try {
            $raw = @(& $brain update --preview --expect-runtime-sha256 $env:BRAIN_TESTED_RUNTIME_PAYLOAD_SHA256 --json 2>&1)
            $previewExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          $previewJson = $raw -join [Environment]::NewLine
          Write-Host $previewJson
          if ($previewExit -ne 1) {
            throw "no-manifest update preview exited $previewExit instead of its closed refusal"
          }
          $global:LASTEXITCODE = 0
          try { $previewReceipt = $previewJson | ConvertFrom-Json }
          catch { throw 'installed brain.cmd did not emit one JSON update-preview receipt' }
          $previewKeys = @($previewReceipt.PSObject.Properties.Name | Sort-Object)
          $expectedPreviewKeys = @(
            'effects', 'error_code', 'operation', 'read_only',
            'schema_version', 'status'
          ) | Sort-Object
          if (($previewKeys -join ',') -cne ($expectedPreviewKeys -join ',') -or
              $previewReceipt.schema_version -ne 1 -or
              $previewReceipt.operation -cne 'brain.update.preview' -or
              $previewReceipt.status -cne 'failed' -or
              $previewReceipt.read_only -ne $true -or
              $previewReceipt.error_code -cne 'UPDATE_PREVIEW_FAILED') {
            throw 'installed brain.cmd emitted an unexpected no-manifest preview receipt'
          }
          $effectKeys = @($previewReceipt.effects.PSObject.Properties.Name | Sort-Object)
          $expectedEffectKeys = @(
            'browser_launches', 'credential_reads', 'manifest_writes',
            'network_requests', 'package_installs', 'skill_writes', 'workspace_writes'
          ) | Sort-Object
          if (($effectKeys -join ',') -cne ($expectedEffectKeys -join ',')) {
            throw 'the installed update-preview effect receipt shape is not closed'
          }
          foreach ($effect in $effectKeys) {
            if ($previewReceipt.effects.$effect -ne 0) {
              throw "installed update preview reported a nonzero $effect effect"
            }
          }
          if (Test-Path -LiteralPath $emptyRoot) {
            throw 'installed update preview wrote inside its isolated no-manifest home'
          }

      # An install must never carry the author's own client data. package.json
      # uses an allowlist; this fails loudly if a future edit turns it into a
      # denylist that misses something.
      - name: package contains no private data
        if: ${{ !cancelled() && steps.verify_package.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="$TARBALL"
          if command -v cygpath >/dev/null 2>&1; then
            tarball=$(cygpath -u "$tarball")
          fi
          contents=$(tar -tzf "$tarball")
          # NOTE: this is a FILENAME check on the tarball only; it never opens a file.
          # It used to grep for the owner's first name, which put a real identity in a
          # public CI config to catch a real identity. Content-level identity scanning is
          # test/package-privacy.test.mjs, which scans every tracked file and is the
          # authority; this step is only a last-ditch check on what npm would ship.
          private_paths=$(
            {
              printf '%s\n' "$contents" | grep -Ei '(^|/)instances(/|$)|(^|/)eval/baselines(/|$)|(^|/)shadow|readiness|\.brain-(migration|ingest)' || true
              printf '%s\n' "$contents" | grep -Ei '(^|/)eval/golden/' | grep -Ev '(^|/)eval/golden/TEMPLATE\.golden\.json$' || true
            } | sort -u
          )
          if [ -n "$private_paths" ]; then
            printf '%s\n' "$private_paths"
            echo "::error::private evaluation data is in the published package"
            exit 1
          fi
          echo "clean"

  # The preflight exists to catch Windows traps. The hosted runner is itself
  # elevated, so this job also proves that the Administrator prerequisite is a
  # STOP while it plants the other traps and proves the preflight says so. It
  # also checks the native unpackaged-process identity branch explicitly.
  preflight-traps:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # v8 understands the raw, unarchived artifact emitted by upload-artifact
      # v7. Resolve the producer's immutable artifact ID, then independently hash
      # the downloaded .tgz before any install command can touch it.
      - name: download the one shared raw package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: .release-package
          skip-decompress: true
          digest-mismatch: error

      - name: download the matching raw runtime identity receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.runtime_identity_artifact_id }}
          path: .release-runtime-identity
          skip-decompress: true
          digest-mismatch: error

      - name: verify exact shared package bytes
        env:
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ needs.package.outputs.package_sha256 }}
          EXPECTED_PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
          EXPECTED_PACKAGE_BYTES: ${{ needs.package.outputs.package_bytes }}
          EXPECTED_PACKAGE_FILE_COUNT: ${{ needs.package.outputs.package_file_count }}
          RUNTIME_IDENTITY_ARTIFACT_NAME: ${{ needs.package.outputs.runtime_identity_artifact_name }}
          EXPECTED_RUNTIME_IDENTITY_ARTIFACT_SHA256: ${{ needs.package.outputs.runtime_identity_artifact_sha256 }}
          EXPECTED_RUNTIME_IDENTITY_ARTIFACT_BYTES: ${{ needs.package.outputs.runtime_identity_artifact_bytes }}
          EXPECTED_IDENTITY_SCHEME: ${{ needs.package.outputs.identity_scheme }}
          EXPECTED_RUNTIME_PAYLOAD_SHA256: ${{ needs.package.outputs.runtime_payload_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tgz=".release-package/$ARTIFACT_NAME"
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const [path, expected, expectedBytes] = process.argv.slice(1);
            if (!/^[0-9a-f]{64}$/.test(expected)) throw new Error("expected package SHA-256 is malformed");
            if (!/^[1-9][0-9]*$/.test(expectedBytes)) throw new Error("expected package byte count is malformed");
            const byteCount = Number(expectedBytes);
            if (!Number.isSafeInteger(byteCount) || fs.statSync(path).size !== byteCount) {
              throw new Error("package byte count does not match the producer receipt");
            }
            const actual = crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
            if (actual !== expected) throw new Error(`package SHA-256 ${actual} does not match ${expected}`);
          ' "$tgz" "$EXPECTED_SHA256" "$EXPECTED_PACKAGE_BYTES"
          node scripts/runtime-identity-receipt.mjs \
            --verify receipt \
            --receipt ".release-runtime-identity/$RUNTIME_IDENTITY_ARTIFACT_NAME" \
            --artifact-sha256 "$EXPECTED_RUNTIME_IDENTITY_ARTIFACT_SHA256" \
            --artifact-bytes "$EXPECTED_RUNTIME_IDENTITY_ARTIFACT_BYTES" \
            --source-sha "$GITHUB_SHA" \
            --package-filename "$ARTIFACT_NAME" \
            --package-version "$EXPECTED_PACKAGE_VERSION" \
            --package-bytes "$EXPECTED_PACKAGE_BYTES" \
            --package-file-count "$EXPECTED_PACKAGE_FILE_COUNT" \
            --package-sha256 "$EXPECTED_SHA256" \
            --identity-scheme "$EXPECTED_IDENTITY_SCHEME" \
            --runtime-payload-sha256 "$EXPECTED_RUNTIME_PAYLOAD_SHA256"
          echo "TARBALL=$tgz" >> "$GITHUB_ENV"
          echo "verified $ARTIFACT_NAME at sha256:$EXPECTED_SHA256"

      # The operator runs preflight from the installed release, not from a
      # source checkout. Extract both scripts and their manifest-selector helper
      # from the one shared artifact so every matrix job proves those exact
      # bytes were actually packaged.
      - name: extract preflight from exact package
        shell: bash
        run: |
          set -euo pipefail
          tarball="$TARBALL"
          if command -v cygpath >/dev/null 2>&1; then
            tarball=$(cygpath -u "$tarball")
          fi
          mkdir -p .packaged-preflight
          tar -xzf "$tarball" -C .packaged-preflight \
            package/tools/preflight.sh package/tools/preflight.ps1 \
            package/operations/installed-manifest.mjs
          test -f .packaged-preflight/package/tools/preflight.sh
          test -f .packaged-preflight/package/tools/preflight.ps1
          test -f .packaged-preflight/package/operations/installed-manifest.mjs
          echo "packaged preflight scripts and manifest selector extracted from $(basename "$tarball")"

      - name: release workflow cannot bypass this CI gate
        run: node scripts/test-release-workflow-contract.mjs

      - name: "trap 1: default execution policy blocks the .ps1 shims"
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope CurrentUser Restricted -Force
          $raw = & powershell -NoProfile -ExecutionPolicy Bypass -File .\.packaged-preflight\package\tools\preflight.ps1 2>&1
          $code = $LASTEXITCODE
          $out = $raw | Out-String
          Set-ExecutionPolicy -Scope CurrentUser Undefined -Force
          Write-Host $out
          if ($out -notmatch 'WARN.*brain\.cmd, npm\.cmd and npx\.cmd') { Write-Host "::error::preflight did not warn about the .ps1 shim block"; exit 1 }
          if ($out -notmatch 'STOP.*running as Administrator') { Write-Host "::error::the elevated CI runner was not refused"; exit 1 }
          if ($out -notmatch 'ok.*this process has no Windows package identity') { Write-Host "::error::native package identity did not prove the hosted process is unpackaged"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::the Administrator STOP must exit 1, got $code"; exit 1 }
          Write-Host "TRAP 1 DETECTED; elevated CI runner also refused as required"
          exit 0

      - name: "trap 2: an app-package data path remains fail-closed"
        shell: powershell
        run: |
          $env:APPDATA = "C:\Users\x\AppData\Local\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming"
          $out = powershell -NoProfile -File .\.packaged-preflight\package\tools\preflight.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'STOP.*app-package data path') { Write-Host "::error::preflight did not stop on the app-package path heuristic"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::a STOP must exit 1, got $code"; exit 1 }
          Write-Host "TRAP 2 PATH HEURISTIC DETECTED, exit 1 as required"
          # The child correctly exited 1; do not let that leak out as this step's verdict.
          exit 0

      - name: "PowerShell 7 proves the native unpackaged-process branch"
        shell: pwsh
        run: |
          $raw = & pwsh -NoProfile -File .\.packaged-preflight\package\tools\preflight.ps1 2>&1
          $code = $LASTEXITCODE
          $out = $raw | Out-String
          Write-Host $out
          if ($out -notmatch 'ok.*this process has no Windows package identity') { Write-Host "::error::PowerShell 7 did not prove the native unpackaged-process branch"; exit 1 }
          if ($out -notmatch 'STOP.*running as Administrator') { Write-Host "::error::the elevated PowerShell 7 runner was not refused"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::the Administrator STOP must exit 1, got $code"; exit 1 }
          Write-Host "POWERSHELL 7 NATIVE PACKAGE CHECK PASSED"
          exit 0

      - name: "trap 3: more than one copy of the CLI on PATH"
        shell: powershell
        run: |
          $a = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\cli-a" -Force
          $b = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\cli-b" -Force
          Set-Content "$a\brain.cmd" "@echo off`r`necho fake-a"
          Set-Content "$b\brain.cmd" "@echo off`r`necho fake-b"
          $env:Path = "$a;$b;$env:Path"
          $out = powershell -NoProfile -File .\.packaged-preflight\package\tools\preflight.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'STOP.*2 copies of the CLI') { Write-Host "::error::preflight did not stop on duplicate CLIs"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::a STOP must exit 1, got $code"; exit 1 }
          Write-Host "TRAP 3 DETECTED, exit 1 as required"
          # The child correctly exited 1; do not let that leak out as this step's verdict.
          exit 0

      - name: "trap 4: an empty earlier Wrangler directory cannot mask a later session"
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'wrangler-layout'
          $env:APPDATA = Join-Path $root 'roaming'
          $env:LOCALAPPDATA = Join-Path $root 'local'
          $env:XDG_CONFIG_HOME = Join-Path $root 'xdg'
          $env:HOME = Join-Path $root 'home'
          $env:USERPROFILE = Join-Path $root 'profile'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'xdg.config\.wrangler\config') | Out-Null
          $session = New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA '.wrangler\config')
          Set-Content (Join-Path $session 'default.toml') 'fixture session marker only'
          $raw = & powershell -NoProfile -File .\.packaged-preflight\package\tools\preflight.ps1 2>&1
          $code = $LASTEXITCODE
          $out = $raw | Out-String
          Write-Host $out
          if ($out -notmatch 'ok\s+wrangler session found') { Write-Host "::error::an empty earlier directory masked the later Wrangler session"; exit 1 }
          if ($out -notmatch 'STOP.*running as Administrator') { Write-Host "::error::the elevated CI runner was not refused"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::the Administrator STOP must exit 1, got $code"; exit 1 }
          Write-Host "TRAP 4 DETECTED; elevated CI runner also refused as required"
          exit 0

      - name: "trap 5: Node 21 is below the supported minimum"
        shell: powershell
        run: |
          $shim = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\node-21" -Force
          @'
          @echo off
          if "%~1"=="-v" (
            echo v21.9.0
            exit /b 0
          )
          > "%~dp0unexpected-node-use" echo unexpected
          exit /b 97
          '@ | Set-Content -Encoding Ascii "$shim\node.cmd"
          $unexpectedNodeUse = Join-Path $shim 'unexpected-node-use'
          $env:Path = "$shim;$env:Path"
          $out = powershell -NoProfile -File .\.packaged-preflight\package\tools\preflight.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if (Test-Path $unexpectedNodeUse) { Write-Host "::error::preflight reused unsupported Node after its version check"; exit 1 }
          if ($out -notmatch 'STOP.*node v21\.9\.0 is too old; the installer needs 22 or newer') { Write-Host "::error::preflight accepted unsupported Node 21"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::unsupported Node must exit 1, got $code"; exit 1 }
          Write-Host "TRAP 5 DETECTED, exit 1 as required"
          exit 0

      - name: "control: the elevated CI machine is stopped for exactly that reason"
        shell: powershell
        run: |
          $raw = & powershell -NoProfile -File .\.packaged-preflight\package\tools\preflight.ps1 2>&1
          $code = $LASTEXITCODE
          $out = $raw | Out-String
          Write-Host $out
          $stops = [regex]::Matches($out, '(?m)^\s+STOP\s+').Count
          if ($out -notmatch 'ok\s+Windows 10 or newer') { Write-Host "::error::supported Windows was not accepted"; exit 1 }
          if ($out -notmatch 'ok\s+LOCALAPPDATA drive has') { Write-Host "::error::the per-user install drive was not accepted"; exit 1 }
          if ($out -notmatch 'STOP.*running as Administrator') { Write-Host "::error::the elevated CI runner was not refused"; exit 1 }
          if ($stops -ne 1) { Write-Host "::error::expected only the Administrator STOP, saw $stops STOP lines"; exit 1 }
          if ($code -ne 1) { Write-Host "::error::the Administrator STOP must exit 1, got $code"; exit 1 }
          Write-Host "CONTROL PASSED: exact Administrator refusal"
          exit 0
