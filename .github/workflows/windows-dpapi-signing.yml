# Build the fixed DPAPI helper and, when all repository variables are present,
# sign it with the protected artifact-signing environment. The signed output is
# a review artifact only. Adopting its EXE and SHA-256 pin into operations/ is a
# separate reviewed source change.

name: windows-dpapi-signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: build and sign the Windows DPAPI helper
    runs-on: windows-latest
    timeout-minutes: 15
    environment: artifact-signing
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; SHA unverified offline
        with:
          persist-credentials: false

      - name: detect whether signing is configured
        id: config
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $required = [ordered]@{
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            ARTIFACT_SIGNING_ENDPOINT = $env:ARTIFACT_SIGNING_ENDPOINT
            ARTIFACT_SIGNING_ACCOUNT = $env:ARTIFACT_SIGNING_ACCOUNT
            ARTIFACT_SIGNING_PROFILE = $env:ARTIFACT_SIGNING_PROFILE
          }
          $missing = @($required.GetEnumerator() |
            Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } |
            ForEach-Object { $_.Key })
          $onDefaultBranch = $env:GITHUB_REF -ceq "refs/heads/$($env:DEFAULT_BRANCH)"
          if ($missing.Count -gt 0) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "Artifact Signing is not configured; unsigned development behavior remains enabled." >> $env:GITHUB_STEP_SUMMARY
            "Missing repository variables: $($missing -join ', ')" >> $env:GITHUB_STEP_SUMMARY
          } elseif (-not $onDefaultBranch) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "Artifact Signing is configured, but signing is restricted to the default branch." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: build the fixed helper once
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc -PathType Leaf)) {
            throw 'the Windows C# compiler is unavailable'
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $csc /nologo /target:exe /optimize+ /out:dist\windows-dpapi-helper.exe /reference:System.Security.dll operations\windows-dpapi.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath dist\windows-dpapi-helper.exe -PathType Leaf)) {
            throw 'the DPAPI helper build failed'
          }

      - name: sign in to Azure with GitHub OIDC
        if: steps.config.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0; SHA unverified offline
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: sign with Artifact Signing
        if: steps.config.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0; SHA unverified offline
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\windows-dpapi-helper.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: verify signature, signer, and write the SHA-256 pin
        if: steps.config.outputs.enabled == 'true'
        run: |
          $helper = Resolve-Path dist\windows-dpapi-helper.exe
          $signature = Get-AuthenticodeSignature -LiteralPath $helper
          if ($signature.Status -ne 'Valid') {
            throw "the helper signature status is $($signature.Status), not Valid"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw 'the helper signature carries no RFC 3161 timestamp'
          }
          $subject = [string]$signature.SignerCertificate.Subject
          if ($subject -notmatch '(?:^|,\s*)O=Financial Brain LLC(?:,|$)') {
            throw 'the helper signer subject does not contain the expected organization'
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $helper).Hash.ToLowerInvariant()
          "$sha256  windows-dpapi-helper.exe" | Set-Content -Encoding ascii dist\windows-dpapi-helper.sha256
          "Signed helper SHA-256: $sha256" >> $env:GITHUB_STEP_SUMMARY

      - name: upload the signed helper and pin
        if: steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; SHA unverified offline
        with:
          name: windows-dpapi-helper-signed
          path: |
            dist/windows-dpapi-helper.exe
            dist/windows-dpapi-helper.sha256
          if-no-files-found: error
          retention-days: 5
